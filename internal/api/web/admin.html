          asgBox.appendChild(h('label',{},[cb,h('span',{html:label}),h('span',{class:'tagi',text:'direct'})]));
        }
      });
    }
    drawAsg();

    const body=h('div',{},[
      h('div',{class:'form-grid'},[field('Username',nameI,true),fieldH('Status',statusS,false,'user_status')]),
      fieldH('Group',grpS,false,'group_assignment'),
      h('div',{class:'hint',style:{marginTop:'-4px'},text:'Changing the group changes which inbounds this user inherits. Direct assignments below are kept either way.'}),
      h('div',{class:'form-grid'},[fieldH('Traffic quota (GB, 0 = unlimited)',limI,false,'data_limit'),
        fieldH('Reset strategy',resetS,false,'reset_strategy')]),
      h('div',{class:'form-grid'},[fieldH('Expires on (empty = never)',expI,false,'expire_at'),
        fieldH('IP limit',ipI,false,'ip_limit')]),
      h('div',{class:'form-grid'},[field('Telegram ID',tgI),field('Note',noteI)]),
      fieldH('Assigned inbounds',asgBox,false,'direct_vs_inherited'),
      h('div',{class:'hint',html:'Direct assignments belong to this user. Inherited ones come from the group and are read-only here.'}),
      h('div',{style:{marginTop:'14px',display:'flex',gap:'8px',flexWrap:'wrap'}},[
        h('button',{class:'btn sm',html:icon('key')+'<span>Reset credentials…</span>',onClick:()=>openReset(u)})])
    ]);

    modal({title:'Edit user — '+(u.username||''),wide:true,body,okText:t('save'),cancelText:t('cancel'),
      onOk:async()=>{
        // Send only what actually changed, and include updated_at so a stale
        // write is refused instead of quietly overwriting someone else's edit.
        const patch={updated_at:d.updated_at};
        const set=(k,v,orig)=>{ if(v!==orig) patch[k]=v; };
        set('username',nameI.value.trim(),u.username||'');
        set('status',statusS.value,u.status||'active');
        set('group_id',Number(grpS.value)||0,Number(u.group_id||0));
        set('data_limit',Math.round(Number(limI.value||0)*1073741824),Number(u.data_limit||0));
        set('reset_strategy',resetS.value,u.reset_strategy||'no_reset');
        set('ip_limit',Number(ipI.value||0),Number(u.ip_limit||0));
        set('telegram_id',Number(tgI.value||0),Number(u.telegram_id||0));
        set('note',noteI.value,u.note||'');
        const newExp=expI.value?new Date(expI.value+'T00:00:00Z').toISOString():null;
        const oldExp=u.expire_at?new Date(u.expire_at).toISOString():null;
        if(newExp!==oldExp) patch.expire_at=newExp;

        const wantDirect=Array.from(direct);
        const sameAsg=wantDirect.length===(asg.direct||[]).length&&
          wantDirect.every(x=>(asg.direct||[]).includes(x));
        if(Object.keys(patch).length>1){
          try{ await api('/api/admin/users/'+id,{method:'PATCH',body:patch}); }
          catch(e){
            if(e.status===409){ toast('This user was changed by someone else — reopen and reapply.','error'); return false; }
            if(e.status===422&&e.data&&e.data.fields){
              toast(Object.entries(e.data.fields).map(([k,v])=>k+': '+v).join('; '),'error'); return false; }
            throw e;
          }
        }
        if(!sameAsg){
          await api('/api/admin/users/'+id+'/inbounds',{method:'PUT',body:{inbound_ids:wantDirect}});
        }
        toast('User updated','success'); load();
      }});
  }

  /* ---- Credential reset -------------------------------------------------- */
  function openReset(u){
    const cbU=h('input',{type:'checkbox'}), cbP=h('input',{type:'checkbox'}), cbS=h('input',{type:'checkbox'});
    const body=h('div',{},[
      h('div',{class:'finding warn',html:icon('alert')+'<div>Rotating the subscription token invalidates every client already configured with this account. They will need the new link.</div>'}),
      h('div',{class:'asg',style:{marginTop:'10px'}},[
        h('label',{},[cbU,h('span',{html:'<b>UUID</b> — VLESS/VMess identity'})]),
        h('label',{},[cbP,h('span',{html:'<b>Password</b> — Trojan/Shadowsocks and friends'})]),
        h('label',{},[cbS,h('span',{html:'<b>Subscription token</b> — the /sub/… link'})])])]);
    modal({title:'Reset credentials — '+u.username,body,okText:'Reset',okKind:'danger',cancelText:t('cancel'),
      onOk:async()=>{
        if(!cbU.checked&&!cbP.checked&&!cbS.checked){ toast('Select at least one credential','error'); return false; }
        if(!await confirmDialog('Reset the selected credentials for "'+u.username+'"? Existing clients using them stop working.')) return false;
        await api('/api/admin/users/'+u.id+'/reset-credentials',
          {method:'POST',body:{uuid:cbU.checked,password:cbP.checked,sub_token:cbS.checked}});
        toast('Credentials reset','success'); load();
      }});
  }

  /* ---- Create user -------------------------------------------------------
     The group control offers "No group" explicitly and pre-selects only a group
     the operator marked as default. It never silently picks the first group in
     the list, and it never creates one. */
  async function openNew(){
    if(!groups.length){ try{ groups=await api('/api/admin/groups')||[]; }catch(e){} }
    const def=groups.find(g=>g.is_default);
    const nameI=inp('u-name',{placeholder:'jane'});
    const opts=[['0','— No group —']].concat(groups.map(g=>[String(g.id),
      g.name+' ('+((g.inbound_ids||[]).length)+' inbounds)'+(g.is_default?' · default':'')]));
    const grpSel=sel('u-grp',opts,def?String(def.id):'0');
    const limitI=inp('u-lim',{type:'number',min:0,value:0,placeholder:'0 = unlimited'});
    const expI=inp('u-exp',{type:'number',min:0,value:30,placeholder:'0 = never'});
    const note=h('div',{class:'hint',id:'u-grp-note'});
    function explain(){
      const id=Number(grpSel.value)||0;
      if(!id){ note.textContent='This user will have no group. They get only the inbounds you assign to them directly, on the Edit screen.'; return; }
      const g=groups.find(x=>x.id===id);
      note.textContent=g?('Inherits '+((g.inbound_ids||[]).length)+' inbound(s) from "'+g.name+'".'):'';
    }
    grpSel.addEventListener('change',explain); explain();

    const body=h('div',{},[ field('Username',nameI,true),
      fieldH('Group',grpSel,false,'group_assignment'), note,
      h('div',{class:'form-grid'},[ fieldH('Data limit (GB)',limitI,false,'data_limit'),
        fieldH('Expires in (days)',expI,false,'expire_at') ]),
      groups.length?null:h('div',{class:'finding info',style:{marginTop:'6px'},html:icon('alert')+'<div>No groups exist yet. You can still create this user with no group and assign inbounds directly afterwards.</div>'})]);
    modal({title:t('newUser'),body,okText:t('create'),cancelText:t('cancel'),
      onOk:async()=>{ const username=nameI.value.trim(); if(!username){ toast('Username required','error'); return false; }
        const payload={username,group_id:Number(grpSel.value)||0,data_limit_gb:Number(limitI.value)||0,expire_days:Number(expI.value)||0};
        const r=await api('/api/admin/users',{method:'POST',body:payload}); toast('User created','success'); load();
        const sub=r.sub_url||('/sub/'+r.sub_token);
        setTimeout(()=>{ const box=h('div',{},[
          h('div',{class:'finding info',html:icon('check')+'<div>User <b>'+esc(r.username)+'</b> created. Share this subscription:</div>'}),
          h('div',{class:'qr-box',style:{marginTop:'12px'},html:QR.svg(sub,190)}),
          h('div',{class:'copybox',style:{marginTop:'12px'}},[h('div',{class:'code wrap',text:sub}),copyBtn(sub)]) ]);
          modal({title:'Subscription ready',body:box,okText:'Done',cancelText:null}); },80);
      }});
  }
  await load();
};
/* ===== Groups ===== */
VIEWS.groups=async function(content){
  clear(content);
  const head=h('div',{class:'section-head'},[h('h3',{text:t('groups')}),h('div',{class:'spacer'}),
    h('button',{class:'btn primary',html:icon('plus')+'<span>'+esc(t('newGroup'))+'</span>',onClick:openNew})]);
  const q=inp('g-q',{placeholder:'Search groups…'});
  const filters=h('div',{class:'filters'},[q]);
  const tableWrap=h('div',{class:'table-wrap'});
  content.appendChild(head); content.appendChild(filters); content.appendChild(tableWrap);
  let inbounds=[], groups=[], memberCount={};
  q.addEventListener('input',draw);

  async function load(){
    tableWrap.innerHTML=''; tableWrap.appendChild(loadingEl());
    const [gs,ins]=await Promise.all([api('/api/admin/groups'),api('/api/admin/inbounds').catch(()=>[])]);
    groups=gs||[]; inbounds=ins||[];
    // Member counts drive the "this affects N users" warnings below, so they are
    // fetched up front rather than only when a destructive action is attempted.
    memberCount={};
    await Promise.all(groups.map(async g=>{
      try{ const d=await api('/api/admin/groups/'+g.id); memberCount[g.id]=d.members||0; }
      catch(e){ memberCount[g.id]=null; }
    }));
    draw();
  }

  function draw(){
    clear(tableWrap);
    if(!groups.length){
      tableWrap.appendChild(emptyEl('No groups yet — a group bundles inbounds so several users can share them. Users can also work with no group at all.'));
      return;
    }
    const needle=(q.value||'').trim().toLowerCase();
    const list=groups.filter(g=>!needle||(g.name||'').toLowerCase().includes(needle)
      ||(g.description||'').toLowerCase().includes(needle));
    if(!list.length){ tableWrap.appendChild(emptyEl('No groups match this search.')); return; }
    const byId={}; inbounds.forEach(i=>byId[i.id]=i);
    const tbl=h('table',{class:'tbl'});
    tbl.appendChild(h('thead',{html:'<tr><th>Name</th><th>Members</th><th>Inbounds</th><th>Bindings</th><th></th></tr>'}));
    const tb=h('tbody');
    list.forEach(g=>{
      const ids=g.inbound_ids||[];
      const names=ids.map(id=>byId[id]?(byId[id].remark||byId[id].protocol):('#'+id))
        .map(n=>'<span class="pill blue">'+esc(n)+'</span>').join(' ');
      const mc=memberCount[g.id];
      const tr=h('tr');
      tr.innerHTML='<td><b>'+esc(g.name)+'</b>'+(g.is_default?' <span class="pill amber">default</span>':'')
          +(g.description?'<div class="hint">'+esc(g.description)+'</div>':'')+'</td>'
        +'<td><span class="badge-count">'+(mc===null||mc===undefined?'?':mc)+'</span></td>'
        +'<td><span class="badge-count">'+ids.length+'</span></td>'
        +'<td>'+(names||'<span class="hint">none</span>')+'</td>';
      const ab=(ic,label,kind,fn)=>{
        const b=h('button',{class:'btn sm'+(kind?' '+kind:''),html:icon(ic),onClick:fn,title:label});
        b.setAttribute('aria-label',label); return b;
      };
      const act=h('td');
      act.appendChild(h('div',{class:'t-actions'},[
        ab('settings','Edit group','',()=>openEdit(g)),
        ab('users','View members','',()=>{ location.hash='#/users'; }),
        ab('check',g.is_default?'Unset as default':'Set as default','',async()=>{
          try{ await api('/api/admin/groups/'+g.id,{method:'PATCH',body:{is_default:!g.is_default}});
            toast(g.is_default?'Default cleared':'Set as default group','success'); load();
          }catch(e){ toast(e.message,'error'); } }),
        ab('trash','Delete group','danger',()=>openDelete(g))
      ]));
      tr.appendChild(act); tb.appendChild(tr);
    });
    tbl.appendChild(tb); tableWrap.appendChild(tbl);
  }

  // inboundPicker is shared by create and edit.
  function inboundPicker(selectedIds){
    const box=h('div',{class:'asg'});
    const sel=new Set(selectedIds||[]);
    if(!inbounds.length) box.appendChild(h('div',{class:'none',text:'No inbounds available — create one first.'}));
    else inbounds.forEach(i=>{
      const cb=h('input',{type:'checkbox',value:String(i.id)});
      cb.checked=sel.has(i.id);
      cb.addEventListener('change',()=>{ cb.checked?sel.add(i.id):sel.delete(i.id); });
      box.appendChild(h('label',{},[cb,h('span',{html:'<b>'+esc(i.remark||'(unnamed)')+'</b> · '
        +esc((i.protocol||'').toUpperCase())+' :'+esc(i.port)
        +(i.enabled===false?' <span class="pill grey">disabled</span>':'')})]));
    });
    return {box,get:()=>Array.from(sel)};
  }

  /* ---- Edit group --------------------------------------------------------
     A group edit reaches every member at once, so the form states the blast
     radius before it is applied rather than after. */
  async function openEdit(g){
    let d; try{ d=await api('/api/admin/groups/'+g.id); }catch(e){ toast(e.message,'error'); return; }
    const cur=d.group||g, members=d.members||0;
    const nameI=inp('ge-name',{value:cur.name||''});
    const descI=inp('ge-desc',{value:cur.description||''});
    const pick=inboundPicker(cur.inbound_ids||[]);
    const defCb=h('input',{type:'checkbox'}); defCb.checked=!!cur.is_default;

    const body=h('div',{},[
      members?h('div',{class:'finding warn',html:icon('alert')+'<div>This group has <b>'+members
        +'</b> member'+(members===1?'':'s')+'. Changing its inbounds changes what every one of them can connect to.</div>'}):null,
      field('Group name',nameI,true),
      field('Description',descI),
      fieldH('Inbounds in this group',pick.box,false,'inbound_assignment'),
      h('label',{class:'chk',style:{marginTop:'10px',display:'flex',gap:'8px',alignItems:'center'}},
        [defCb,h('span',{text:'Pre-select this group when creating a user'}),helpIcon('group_assignment')]),
      h('div',{class:'hint',text:'A default is only a pre-selection in the create form. It is never applied to a user without the administrator seeing it.'})
    ].filter(Boolean));

    modal({title:'Edit group — '+(cur.name||''),wide:true,body,okText:t('save'),cancelText:t('cancel'),
      onOk:async()=>{
        const name=nameI.value.trim(); if(!name){ toast('Name required','error'); return false; }
        const ids=pick.get();
        const removed=(cur.inbound_ids||[]).filter(x=>!ids.includes(x));
        if(removed.length&&members){
          if(!await confirmDialog('Removing '+removed.length+' inbound(s) will take that access away from '
            +members+' member'+(members===1?'':'s')+' immediately. Continue?')) return false;
        }
        const patch={name,description:descI.value,inbound_ids:ids,updated_at:d.updated_at};
        if(!!cur.is_default!==defCb.checked) patch.is_default=defCb.checked;
        try{ await api('/api/admin/groups/'+cur.id,{method:'PATCH',body:patch}); }
        catch(e){
          if(e.status===409){ toast('This group was changed by someone else — reopen and reapply.','error'); return false; }
          throw e;
        }
        toast('Group updated','success'); load();
      }});
  }

  /* ---- Delete group ------------------------------------------------------
     Deleting a container must never delete its contents. When the group has
     members the dialog makes the operator choose what happens to them; there is
     no path here that removes a user account. */
  async function openDelete(g){
    let members=memberCount[g.id];
    if(members===null||members===undefined){
      try{ members=(await api('/api/admin/groups/'+g.id)).members||0; }catch(e){ members=0; }
    }
    if(!members){
      if(await confirmDialog('Delete group "'+g.name+'"? It has no members.')){
        try{ await api('/api/admin/groups/'+g.id,{method:'DELETE'}); toast('Group deleted','success'); load(); }
        catch(e){ toast(e.message,'error'); }
      }
      return;
    }
    const others=groups.filter(x=>x.id!==g.id);
    const modeS=sel('gd-mode',[['none','Leave them with no group']].concat(
      others.length?[['move','Move them to another group']]:[]),'none');
    const targetS=sel('gd-to',others.map(x=>[String(x.id),x.name]),others.length?String(others[0].id):'');
    const targetField=field('Move members to',targetS,true);
    targetField.style.display='none';
    modeS.addEventListener('change',()=>{ targetField.style.display=modeS.value==='move'?'':'none'; });

    const body=h('div',{},[
      h('div',{class:'finding warn',html:icon('alert')+'<div>"'+esc(g.name)+'" has <b>'+members+'</b> member'
        +(members===1?'':'s')+'. <b>No user account will be deleted</b> — choose where they go.</div>'}),
      field('What happens to the members',modeS,true), targetField,
      h('div',{class:'hint',text:'Members left with no group keep any inbounds assigned to them directly, and lose the ones this group granted.'})
    ]);
    modal({title:'Delete group — '+g.name,body,okText:'Delete group',okKind:'danger',cancelText:t('cancel'),
      onOk:async()=>{
        const qs=modeS.value==='move'
          ? '?reassign_to='+encodeURIComponent(targetS.value)
          : '?remove_members_from_group=true';
        await api('/api/admin/groups/'+g.id+qs,{method:'DELETE'});
        toast('Group deleted — members kept','success'); load();
      }});
  }

  async function openNew(){
    if(!inbounds.length){ try{ inbounds=await api('/api/admin/inbounds')||[]; }catch(e){} }
    const nameI=inp('g-name',{placeholder:'premium'});
    const descI=inp('g-desc',{placeholder:'optional description'});
    const pick=inboundPicker([]);
    const body=h('div',{},[field('Group name',nameI,true),field('Description',descI),
      fieldH('Inbounds in this group',pick.box,true,'inbound_assignment')]);
    modal({title:t('newGroup'),body,okText:t('create'),cancelText:t('cancel'),
      onOk:async()=>{ const name=nameI.value.trim(); if(!name){ toast('Name required','error'); return false; }
        const ids=pick.get();
        if(!ids.length){ toast('Select at least one inbound','error'); return false; }
        await api('/api/admin/groups',{method:'POST',body:{name,description:descI.value,inbound_ids:ids}});
        toast('Group created','success'); load(); }});
  }
  await load();
};

VIEWS.certs=async function(content){

  // domain tools card
  const toolsOut=h('div',{style:{marginTop:'12px'}});
  const dCheck=inp('c-domain',{placeholder:'example.com'}); const dIP=inp('c-ip',{placeholder:'server IP (optional)'});
  const nsZone=inp('c-zone',{placeholder:'tunnel.example.com'}); const nsIP=inp('c-nsip',{placeholder:'server IP'});
  const tools=h('div',{class:'card pad',style:{marginTop:'18px'}},[
    h('div',{class:'subhead',text:'Domain tools'}),
    h('div',{class:'row'},[field('Check domain',dCheck),field('Expected IP',dIP),
      h('button',{class:'btn',html:icon('globe')+'<span>Check</span>',onClick:checkDomain})]),
    h('div',{class:'row',style:{marginTop:'10px'}},[field('NS wizard · zone',nsZone),field('Server IP',nsIP),
      h('button',{class:'btn',html:icon('globe')+'<span>Records</span>',onClick:nsWizard})]),
    toolsOut]);

  async function load(){ tableWrap.innerHTML=''; tableWrap.appendChild(loadingEl());
    const rows=await api('/api/admin/certs').catch(()=>[]); clear(tableWrap);
    if(!rows||!rows.length){ tableWrap.appendChild(emptyEl('No certificates imported')); content.appendChild(tools); return; }
    const tbl=h('table',{class:'tbl'});
    tbl.appendChild(h('thead',{html:'<tr><th>Domains</th><th>Issuer</th><th>Expires</th><th>Status</th></tr>'}));
    const tb=h('tbody');
    rows.forEach(cr=>{ const na=cr.not_after?new Date(cr.not_after):null; const days=na?Math.round((na-Date.now())/86400000):null;
      const st=days==null?pill('grey','—'):(days<0?pill('red','expired'):(days<21?pill('amber',days+'d left'):pill('green','valid')));
      tb.appendChild(h('tr',{html:'<td><b>'+esc((cr.domains||[]).join(', ')||'—')+'</b></td><td>'+esc(cr.issuer||'—')+'</td><td class="t-mono">'+esc(fmtDate(cr.not_after))+'</td><td>'+st+'</td>'})); });
    tbl.appendChild(tb); tableWrap.appendChild(tbl); content.appendChild(tools);

  async function checkDomain(){ const domain=dCheck.value.trim(); if(!domain){ toast('Enter a domain','error'); return; }
    clear(toolsOut); toolsOut.appendChild(loadingEl('Resolving…'));
    try{ const r=await api('/api/admin/domains/check?domain='+encodeURIComponent(domain)+'&ip='+encodeURIComponent(dIP.value.trim()));
      clear(toolsOut); toolsOut.appendChild(h('div',{class:'card pad'},[
        h('div',{class:'kv',html:'<b>Resolved</b><span class="t-mono">'+esc((r.resolved||[]).join(', ')||'—')+'</span>'}),
        h('div',{class:'kv',html:'<b>Matches IP</b>'+(r.matches_ip?pill('green','yes'):pill('red','no'))}),
        h('div',{class:'kv',html:'<b>Reachable</b>'+(r.reachable?pill('green','yes'):pill('grey','no'))+(r.error?' <span class="hint">'+esc(r.error)+'</span>':'')}) ]));
    }catch(e){ clear(toolsOut); toast(e.message,'error'); } }
  async function nsWizard(){ const zone=nsZone.value.trim(); if(!zone){ toast('Enter a zone','error'); return; }
    clear(toolsOut); toolsOut.appendChild(loadingEl());
    try{ const r=await api('/api/admin/domains/ns-wizard?zone='+encodeURIComponent(zone)+'&ip='+encodeURIComponent(nsIP.value.trim()));
      clear(toolsOut); toolsOut.appendChild(nsTable(r.records,r.verification));
    }catch(e){ clear(toolsOut); toast(e.message,'error'); } }
  await load();
};
function nsTable(records,verify){ const wrap=h('div',{class:'card pad'});

/* ===== ForgeDNS ===== */
VIEWS.forgedns=async function(content){
  clear(content);
  let adapters=['forge']; try{ adapters=await api('/api/admin/forgedns/adapters')||['forge']; }catch(e){}
  const statusTile=h('div',{class:'card pad',style:{marginBottom:'16px'}});
  // create form
  const zoneI=inp('fd-zone',{placeholder:'tunnel.example.com'});
  const adSel=sel('fd-adapter',adapters,adapters[0]);
  const createCard=h('div',{class:'card pad',style:{marginBottom:'16px'}},[
    h('div',{class:'subhead',text:'Create a tunnel zone'}),
    h('div',{class:'row'},[field('Zone',zoneI),field('Adapter',adSel),
      h('button',{class:'btn primary',html:icon('plus')+'<span>Create & activate</span>',onClick:create})])]);
  const tableWrap=h('div',{class:'table-wrap'});
  content.appendChild(statusTile); content.appendChild(createCard); content.appendChild(tableWrap);

  async function create(){ const zone=zoneI.value.trim(); if(!zone){ toast('Zone required','error'); return; }
    try{ await api('/api/admin/forgedns/zones',{method:'POST',body:{zone,adapter:adSel.value}}); toast('Zone created & activated','success'); zoneI.value=''; refresh(); }
    catch(e){ toast(e.message,'error'); } }

  async function refresh(){
    let status={listening:false}, zones=[];
    try{ [status,zones]=await Promise.all([api('/api/admin/forgedns/status'),api('/api/admin/forgedns/zones')]); }catch(e){ if(e.status===401) return; }
    zones=zones||[];
    clear(statusTile);
    statusTile.appendChild(h('div',{class:'section-head'},[h('h3',{text:'DNS tunnel listener'}),h('div',{class:'spacer'}),
      h('div',{html:status.listening?pill('green','listening on '+esc(status.addr||'')):pill('grey','stopped')})]));
    // Do NOT set the global indicator from one subsystem — see refreshHealth.
    // session counts per zone (best-effort, live)
    const counts={};
    await Promise.all(zones.map(async z=>{ try{ const s=await api('/api/admin/forgedns/zones/'+z.id+'/sessions'); counts[z.id]=(s||[]).length; }catch(e){ counts[z.id]=0; } }));
    clear(tableWrap);
    if(!zones.length){ tableWrap.appendChild(emptyEl('No zones yet — create one above')); return; }
    const list=h('div');
    zones.forEach(z=>{
      const row=h('div',{class:'card pad',style:{marginBottom:'10px'}});
      const headRow=h('div',{class:'section-head',style:{marginBottom:'0'}},[
        h('div',{html:'<b style="font-size:15px">'+esc(z.zone)+'</b> '+pill('blue',z.adapter)+' '+(z.enabled?pill('green','active'):pill('grey','inactive'))
          +' <span class="badge-count" title="live sessions">'+(counts[z.id]||0)+' sessions</span>'}),
        h('div',{class:'spacer'}),
        h('button',{class:'btn sm',text:z.enabled?'Deactivate':'Activate',onClick:async()=>{ try{ await api('/api/admin/forgedns/zones/'+z.id+'/toggle',{method:'POST'}); refresh(); }catch(e){ toast(e.message,'error'); } }}),
        (z.adapter&&z.adapter!=='forge')?h('button',{class:'btn sm',html:icon('settings')+'<span>Advanced</span>',onClick:()=>openForgeDNSConfig(z.id,z.zone,z.adapter)}):null,
        h('button',{class:'btn sm danger',html:icon('trash'),onClick:async()=>{ if(await confirmDialog('Delete zone "'+z.zone+'"?')){ try{ await api('/api/admin/forgedns/zones/'+z.id,{method:'DELETE'}); toast('Zone deleted','success'); refresh(); }catch(e){ toast(e.message,'error'); } } }})]);
      row.appendChild(headRow);
      // setup expander (lazy-loads client config + NS records)
      const exp=h('details',{class:'expander'}); const sum=h('summary',{html:icon('chev','chev')+'<span>Setup &amp; client config</span>'});
      const expBody=h('div',{class:'exp-body',html:'<div class="hint">Open to load NS records and the client URI.</div>'});
      exp.appendChild(sum); exp.appendChild(expBody);
      let loaded=false;
      exp.addEventListener('toggle',async()=>{ if(!exp.open||loaded) return; loaded=true;
        clear(expBody); expBody.appendChild(loadingEl());
        try{ const c=await api('/api/admin/forgedns/zones/'+z.id+'/client?ip=');
          clear(expBody);
          if(c.uri){ expBody.appendChild(h('div',{class:'subhead',text:'Client URI'}));
            expBody.appendChild(h('div',{class:'copybox'},[h('div',{class:'code wrap',text:c.uri}),copyBtn(c.uri)])); }
          if(c.ns_records&&c.ns_records.length){ expBody.appendChild(h('div',{class:'subhead',text:'NS delegation records'}));
            const tbl=h('table',{class:'tbl'}); tbl.appendChild(h('thead',{html:'<tr><th>Type</th><th>Name</th><th>Value</th></tr>'}));
            const tb=h('tbody'); c.ns_records.forEach(rec=>tb.appendChild(h('tr',{html:'<td>'+pill('blue',rec.type)+'</td><td class="t-mono">'+esc(rec.name)+'</td><td class="t-mono">'+esc(rec.value)+'</td>'})));
            tbl.appendChild(tb); expBody.appendChild(h('div',{class:'table-wrap'},[tbl])); }
        }catch(e){ clear(expBody); expBody.appendChild(h('div',{class:'finding warn',html:icon('alert')+'<div>'+esc(e.message)+'</div>'})); }
      });
      row.appendChild(exp); list.appendChild(row);
    });
    tableWrap.className=''; clear(tableWrap); tableWrap.appendChild(list);
  }
  await refresh();
  poll(refresh,5000);
};

/* ForgeDNS advanced-TOML editor: shows the effective (merged, secrets-masked)
   server/client config, lets the operator save an advanced override, and import
   an existing TOML — unknown keys are preserved by the backend. */
async function openForgeDNSConfig(id,zone,adapter){
  let cfg={};
  try{ cfg=await api('/api/admin/forgedns/zones/'+id+'/config'); }catch(e){ toast(e.message,'error'); return; }
  const srv=cfg.server||{}, cli=cfg.client||{};
  const unk=(srv.unknown_keys||[]).length;
  const body=h('div');
  body.appendChild(h('div',{class:'hint',style:{marginBottom:'10px'},html:'Zone <b>'+esc(zone)+'</b> · adapter '+pill('blue',adapter||cfg.adapter||'')
    +' · CONFIG_VERSION '+esc(String(cfg.config_version||''))
    +(unk?' · '+pill('amber',unk+' unknown key'+(unk>1?'s':'')+' preserved'):'')
    +'. Secrets are masked ('+esc(cfg.masked_value||'********')+') — leave them masked to keep the stored value.'}));
  const effServer=h('textarea',{class:'input mono',rows:8,readonly:true}); effServer.value=srv.toml||'';
  const effClient=h('textarea',{class:'input mono',rows:6,readonly:true}); effClient.value=cli.toml||'';
  const override=h('textarea',{class:'input mono',rows:6,placeholder:'# advanced override — TOML keys to add/replace on top of the managed config\n# unknown keys are preserved'});
  override.value=srv.override_toml||'';
  const importBox=h('textarea',{class:'input mono',rows:5,placeholder:'# paste an existing server_config.toml to import (unknown keys preserved)'});
  body.appendChild(h('div',{class:'subhead',text:'Effective server config (read-only)'})); body.appendChild(effServer);
  body.appendChild(h('div',{class:'subhead',text:'Effective client config (read-only)'})); body.appendChild(effClient);
  body.appendChild(h('div',{class:'subhead',text:'Advanced server override (editable)'})); body.appendChild(override);
  body.appendChild(h('div',{style:{display:'flex',gap:'8px',marginTop:'8px'}},[
    h('button',{class:'btn primary',html:icon('check')+'<span>Save override</span>',onClick:save})]));
  body.appendChild(h('div',{class:'subhead',style:{marginTop:'14px'},text:'Import a server TOML'})); body.appendChild(importBox);
  body.appendChild(h('div',{style:{marginTop:'8px'}},[h('button',{class:'btn',html:icon('copy')+'<span>Import (preserve unknown keys)</span>',onClick:doImport})]));
  const m=modal({title:'ForgeDNS advanced config',wide:true,body,hideFooter:true});
  async function save(){
    try{ await api('/api/admin/forgedns/zones/'+id+'/config',{method:'PUT',body:{scope:'server',toml:override.value}});
      toast('Override saved & validated','success'); m.close(); }
    catch(e){ toast(e.message,'error'); }
  }
  async function doImport(){
    if(!importBox.value.trim()){ toast('Paste a TOML first','error'); return; }
    try{ const r=await api('/api/admin/forgedns/zones/'+id+'/config/import',{method:'POST',body:{scope:'server',toml:importBox.value,apply:true}});
      toast('Imported — unknown keys preserved','success'); override.value=(r&&r.override_toml)||override.value; }
    catch(e){ toast(e.message,'error'); }
  }
}

// renderPanelAddress fills a card with the panel's current address + cert status
// and the controls to change domain/port/HTTPS, test DNS/port, and renew the cert.
async function renderPanelAddress(card){
  clear(card); card.appendChild(loadingEl('Loading panel address…'));
  let pa; try{ pa=await api('/api/admin/panel-address'); }
  catch(e){ clear(card); card.appendChild(h('div',{class:'subhead',text:'Panel address'})); card.appendChild(h('div',{class:'hint',text:e.message})); return; }
  clear(card);
  const cert=pa.cert||{}, acme=cert.acme||{};
  card.appendChild(h('div',{class:'subhead',text:'Panel address'}));
  const urlRow=h('div',{class:'kv'},[h('b',{text:'Public URL'}),h('span',{class:'row',style:{gap:'8px'}},[h('span',{class:'t-mono',text:pa.public_url}),copyBtn(pa.public_url)])]);
  card.appendChild(urlRow);
  card.appendChild(h('div',{class:'kv',html:'<b>HTTPS</b>'+(pa.https_enabled?pill('green','on'):pill('grey','off — HTTP'))}));
  card.appendChild(h('div',{class:'kv',html:'<b>Server IPv4</b><span class="t-mono">'+esc(pa.server_ipv4||'—')+'</span>'}));
  if(pa.server_ipv6) card.appendChild(h('div',{class:'kv',html:'<b>Server IPv6</b><span class="t-mono">'+esc(pa.server_ipv6)+'</span>'}));
  if(cert.available){
    card.appendChild(h('div',{class:'kv',html:'<b>Certificate</b><span>'+esc(cert.issuer||'issued')+' · expires '+esc((cert.not_after||'').slice(0,10))
      +' '+pill(cert.days_remaining>15?'green':'amber',(cert.days_remaining|0)+'d left')+'</span>'}));
  } else if(pa.https_enabled){
    card.appendChild(h('div',{class:'kv',html:'<b>Certificate</b>'+pill('amber','not issued yet')}));
  }

  // editable controls
  const domainI=inp('pa-domain',{placeholder:'panel.example.com',value:pa.domain||''});
  const portI=inp('pa-port',{type:'number',min:'1',max:'65535',value:String(pa.port||2053)});
  const httpsChk=h('input',{type:'checkbox',id:'pa-https'}); if(pa.https_enabled) httpsChk.checked=true;
  const emailI=inp('pa-email',{type:'email',placeholder:'you@example.com',value:acme.email||''});
  const dnsBtn=h('button',{class:'btn sm',type:'button',html:icon('search')+'<span>Test DNS</span>',onClick:testDNS});
  const portBtn=h('button',{class:'btn sm',type:'button',html:icon('search')+'<span>Test port</span>',onClick:testPort});
  card.appendChild(h('div',{class:'subhead',style:{marginTop:'16px'},text:'Change address'}));
  card.appendChild(h('div',{class:'form-grid'},[
    field('Domain (blank = IP-based HTTP)',h('div',{class:'row',style:{gap:'8px'}},[domainI,dnsBtn])),
    field('Port',h('div',{class:'row',style:{gap:'8px'}},[portI,portBtn])),
    field('ACME email (for Let’s Encrypt)',emailI),
    field('Automatic HTTPS',h('label',{class:'row',style:{gap:'8px',alignItems:'center'}},[httpsChk,h('span',{class:'hint',text:'Requires a domain that points here'})]))]));
  card.appendChild(h('div',{class:'row',style:{marginTop:'10px',gap:'8px'}},[
    h('button',{class:'btn primary',type:'button',html:icon('check')+'<span>Save changes</span>',onClick:save}),
    (pa.https_enabled&&pa.domain)?h('button',{class:'btn',type:'button',html:icon('reload')+'<span>Renew certificate</span>',onClick:renewCert}):null]));

  async function testDNS(){
    const d=domainI.value.trim(); if(!d){ toast('Enter a domain first','error'); return; }
    try{ const r=await api('/api/admin/panel-address/dns-check?domain='+encodeURIComponent(d));
      if(!r.resolves){ toast('Domain does not resolve','error'); return; }
      toast(r.points_here?('✓ '+d+' points to this server'):('⚠ '+d+' resolves to '+(r.a||[]).join(', ')+' — not this server ('+r.server_ipv4+')'), r.points_here?'success':'info');
    }catch(e){ toast(e.message,'error'); }
  }
  async function testPort(){
    const p=parseInt(portI.value,10); if(!p){ toast('Enter a port','error'); return; }
    try{ const r=await api('/api/admin/panel-address/port-check?port='+p);
      toast(r.available?('✓ port '+p+(r.current?' (current panel port)':' is free')):('⚠ port '+p+' is in use'), r.available?'success':'error');
    }catch(e){ toast(e.message,'error'); }
  }
  async function renewCert(e){ const b=e.currentTarget; b.disabled=true;
    try{ await api('/api/admin/panel-address/cert/renew',{method:'POST'}); toast('Certificate renewed','success'); await renderPanelAddress(card); }
    catch(err){ toast(err.message,'error'); } finally{ b.disabled=false; }
  }
  async function save(e){
    const body={domain:domainI.value.trim(),port:parseInt(portI.value,10),https_enabled:httpsChk.checked,acme_email:emailI.value.trim(),verify_dns:false};
    if(body.https_enabled&&!body.domain){ toast('A domain is required for HTTPS','error'); return; }
    const scheme=body.https_enabled?'https':'http';
    const host=body.domain||pa.server_ipv4;
    const newURL=scheme+'://'+host+(([80,443].includes(body.port))?'':(':'+body.port))+(pa.admin_path||'');
    if(!await confirmDialog('Apply new panel address?\n\nOld: '+pa.public_url+'\nNew: '+newURL+'\n\nA port or HTTPS change needs a restart to take effect.')) return;
    const b=e.currentTarget; b.disabled=true;
    try{ const r=await api('/api/admin/panel-address',{method:'POST',body});
      toast('Panel address updated'+(r.restart_required?' — restart the service to apply':''), r.restart_required?'info':'success');
      await renderPanelAddress(card);
    }catch(err){ toast(err.message,'error'); } finally{ b.disabled=false; }
  }
}

      field('Confirmation code',codeI,true)]);
    modal({title:'Enable 2FA',body:box,okText:'Confirm',cancelText:t('cancel'),
      onOk:async()=>{ const code=codeI.value.trim(); if(!code){ toast('Enter the code','error'); return false; }
        let r; try{ r=await api('/api/admin/2fa/enable',{method:'POST',body:{code}}); }
        catch(e){ if(e.status===404||e.status===501){ toast('Not available on this server','info'); return true; } toast(e.message,'error'); return false; }
        toast('2FA enabled','success');
        if(r&&r.recovery_codes&&r.recovery_codes.length){ setTimeout(()=>{
          const rc=h('div',{},[h('div',{class:'finding warn',html:icon('alert')+'<div>Save these recovery codes now — they are shown once.</div>'}),
            h('div',{class:'code',style:{marginTop:'12px'},text:r.recovery_codes.join('\n')}),
            h('div',{style:{marginTop:'10px'}},[copyBtn(r.recovery_codes.join('\n'))])]);
          modal({title:'Recovery codes',body:rc,okText:'I saved them',cancelText:null}); },80); }
      }});
  }
  async function disable2fa(){
    const codeI=inp('fa-dis',{class:'input mono',placeholder:'123456',inputmode:'numeric'});
    modal({title:'Disable 2FA',body:field('Current 2FA code',codeI,true),okText:'Disable',okKind:'danger',cancelText:t('cancel'),
      onOk:async()=>{ const code=codeI.value.trim(); if(!code){ toast('Enter the code','error'); return false; }
        try{ await api('/api/admin/2fa/disable',{method:'POST',body:{code}}); toast('2FA disabled','success'); }
        catch(e){ if(e.status===404||e.status===501){ toast('Not available on this server','info'); return true; } toast(e.message,'error'); return false; } }});
  }

  // change password card
  const oldI=inp('pw-old',{type:'password',placeholder:'current password'});
  const newI=inp('pw-new',{type:'password',placeholder:'new password'});
  const new2I=inp('pw-new2',{type:'password',placeholder:'repeat new password'});
  const pwCard=h('div',{class:'card pad'},[
    h('div',{class:'subhead',text:'Change password'}),
    h('div',{class:'form-grid'},[field('Current',oldI),field('',h('div')), field('New',newI),field('Repeat',new2I)]),
    h('div',{style:{marginTop:'6px'}},[h('button',{class:'btn primary',html:icon('key')+'<span>Update password</span>',onClick:changePw})]) ]);
  content.appendChild(pwCard);
  async function changePw(e){ const b=e.currentTarget;
    if(!oldI.value||!newI.value){ toast('Fill in both password fields','error'); return; }
    if(newI.value!==new2I.value){ toast('New passwords do not match','error'); return; }
    b.disabled=true;
    try{ await api('/api/admin/change-password',{method:'POST',body:{old:oldI.value,new:newI.value}}); toast('Password updated','success'); oldI.value=newI.value=new2I.value=''; }
    catch(err){ if(err.status===404||err.status===501) toast('Password change is not available on this server','info'); else toast(err.message,'error'); }
    finally{ b.disabled=false; }
  }
};

/* ---------------------------------------------------------------------------
   BOOTSTRAP. Restore theme/lang, then route: token present -> app, else login.
   --------------------------------------------------------------------------- */
applyTheme(); applyLang();
if(state.token){ if(!location.hash||location.hash==='#') location.hash='#/dashboard'; renderApp(); }
else renderAuth();

</script>
</body>
</html>
