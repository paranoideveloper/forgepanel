<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ForgePanel</title>
<meta name="theme-color" content="#0B0F16">
<style>
/* ============================================================================
   ForgePanel admin — single-file SPA. All CSS lives here (CSP: 'self' +
   'unsafe-inline' only). Theming is driven by [data-theme] on <html> so the
   toggle is a one-attribute flip. Layout is flex/grid so it mirrors cleanly
   under dir="rtl" with no extra rules.
   ========================================================================== */
/* CoreForge design system — matches coreforge.example.com (AppTheme.swift tokens).
   Brand orange #FF7A1A. Dark is the native theme; light is a faithful inversion
   that keeps the orange brand. Everything is [data-theme]-driven so the toggle
   flips both. */
:root{
  --accent:#FF7A1A; --accent-2:#FFA733; --accent-pressed:#D96B17; --accent-soft:rgba(255,122,26,.14);
  --accent-ink:#1a1204; /* dark ink for text on the orange gradient */
  --radius:16px; --radius-sm:11px; --gap:18px;
  --font:"SF Pro Rounded",ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans","Vazirmatn",sans-serif;
  --ok:#27D17C; --warn:#FFB020; --err:#FF4D4D; --muted-pill:#7b8290; --info:#1E90FF;
}
html[data-theme="dark"]{
  --bg:#0B0F16; --bg-2:#0F1420; --panel:#141A24; --panel-2:#1A2230; --card:#141A24;
  --border:rgba(255,255,255,.08); --border-soft:rgba(255,255,255,.055);
  --text:rgba(255,255,255,.92); --text-dim:rgba(255,255,255,.70); --text-faint:rgba(255,255,255,.45);
  --shadow:0 8px 22px -12px rgba(0,0,0,.55); --input:#0F1420; --input-border:rgba(255,255,255,.12);
  --grad:radial-gradient(1200px 600px at 15% -10%,rgba(255,122,26,.12),transparent 60%),radial-gradient(900px 520px at 100% 0%,rgba(30,144,255,.06),transparent 55%);
}
html[data-theme="light"]{
  --bg:#F5F7FA; --bg-2:#FFFFFF; --panel:#FFFFFF; --panel-2:#F1F4F8; --card:#FFFFFF;
  --border:rgba(11,15,22,.10); --border-soft:rgba(11,15,22,.055);
  --text:#141A24; --text-dim:#586074; --text-faint:#8A93A4;
  --shadow:0 10px 26px -14px rgba(20,26,36,.20); --input:#FFFFFF; --input-border:rgba(11,15,22,.14);
  --grad:radial-gradient(1200px 600px at 15% -10%,rgba(255,122,26,.10),transparent 60%),radial-gradient(900px 520px at 100% 0%,rgba(30,144,255,.05),transparent 55%);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0;background:var(--grad);pointer-events:none;z-index:0}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--input-border)}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--input-border);background:var(--panel-2);color:var(--text);
  padding:8px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:600;transition:.15s;white-space:nowrap;line-height:1}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));border-color:transparent;color:var(--accent-ink);font-weight:700;box-shadow:0 6px 20px -8px rgba(255,122,26,.55)}
.btn.primary:hover{filter:brightness(1.05);transform:translateY(-1px);color:var(--accent-ink)}
.btn.danger{color:var(--err);border-color:transparent;background:rgba(255,77,77,.12)}
.btn.danger:hover{background:rgba(255,77,77,.2);color:var(--err)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-dim)}
.btn.ghost:hover{color:var(--accent);background:var(--accent-soft)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.icon{padding:8px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

/* ---- login ---- */
.login-wrap{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:390px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:34px 30px;box-shadow:var(--shadow)}
.login-brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:6px}
.login-brand .logo{width:42px;height:42px}
.login-brand h1{font-size:22px;margin:0;letter-spacing:-.4px}
.login-sub{text-align:center;color:var(--text-dim);font-size:13px;margin:2px 0 26px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:6px}
.input,select.input,textarea.input{width:100%;background:var(--input);border:1px solid var(--input-border);color:var(--text);
  border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;font-family:inherit;transition:.15s;outline:none}
textarea.input{resize:vertical;min-height:80px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.input:focus,select.input:focus,textarea.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.hint{font-size:11.5px;color:var(--text-faint);margin-top:5px}
.login-err{background:rgba(255,77,77,.12);color:var(--err);border:1px solid rgba(255,77,77,.3);padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:14px}

/* ---- app shell ---- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{background:var(--panel);border-inline-end:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:18px 20px;border-bottom:1px solid var(--border-soft)}
.brand .logo{width:32px;height:32px;flex:none}
.brand b{font-size:16.5px;letter-spacing:-.3px}
.wordmark{font-weight:800;letter-spacing:-.02em}
.wordmark .fg{color:var(--accent)}
.brand small{display:block;color:var(--text-faint);font-size:10.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.nav{padding:12px 12px;flex:1;overflow-y:auto}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--text-dim);font-weight:600;font-size:13.5px;margin-bottom:3px;transition:.13s;cursor:pointer}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav a:hover{background:var(--panel-2);color:var(--text)}
.nav a.active{background:var(--accent-soft);color:var(--accent)}
.nav a.active svg{opacity:1}
.sidebar-foot{padding:14px 16px;border-top:1px solid var(--border-soft);font-size:11px;color:var(--text-faint)}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 22px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-soft)}
.topbar .hamburger{display:none}
.topbar h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.3px}
.topbar .spacer{flex:1}
.health{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);background:var(--panel);border:1px solid var(--border);padding:6px 11px;border-radius:20px;font-weight:600}
.health{cursor:pointer;position:relative}
.health:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.health .dot{width:8px;height:8px;border-radius:50%;background:var(--muted-pill)}
/* Health colours never carry meaning on their own — the adjacent .txt always
   names the state, so the indicator works in monochrome and for screen readers. */
.health.s-healthy .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(39,209,124,.18)}
.health.s-warning .dot{background:var(--warn,#e8a33d);box-shadow:0 0 0 3px rgba(232,163,61,.18)}
.health.s-critical .dot{background:var(--err);box-shadow:0 0 0 3px rgba(255,77,77,.18)}
.health.s-not_configured .dot{background:var(--muted-pill)}
.health.s-unknown .dot{background:var(--muted-pill);box-shadow:0 0 0 3px rgba(148,163,184,.16)}
.health .caret{opacity:.6;font-size:9px}
/* Health details popover */
.hpop{position:absolute;top:calc(100% + 8px);right:0;width:min(380px,calc(100vw - 32px));
  background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:6px;
  box-shadow:0 18px 44px rgba(0,0,0,.34);z-index:60;text-align:start}
.hpop .hrow{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border-radius:9px}
.hpop .hrow+.hrow{border-top:1px solid var(--border)}
.hpop .hrow .d{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;background:var(--muted-pill)}
.hpop .hrow.s-healthy .d{background:var(--ok)}
.hpop .hrow.s-warning .d{background:var(--warn,#e8a33d)}
.hpop .hrow.s-critical .d{background:var(--err)}
.hpop .hrow .b{flex:1;min-width:0}
.hpop .hrow .nm{font-weight:700;font-size:12px;display:flex;gap:7px;align-items:center}
.hpop .hrow .st{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint)}
.hpop .hrow .sm{font-size:12px;color:var(--text-dim);margin-top:2px;line-height:1.45}
.hpop .hrow .dt{font-size:11px;color:var(--text-faint);margin-top:3px;line-height:1.45;word-break:break-word}
/* Contextual help: an accessible info affordance next to a label. Click/Enter/
   Space opens it — never hover alone, which is unusable on touch and invisible
   to keyboard users. */
.help-b{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
  border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text-faint);
  font-size:10px;font-weight:700;cursor:pointer;padding:0;margin-inline-start:6px;line-height:1;vertical-align:middle}
.help-b:hover{color:var(--brand);border-color:var(--brand)}
.help-b:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.help-pop{position:fixed;z-index:120;width:min(320px,calc(100vw - 24px));background:var(--panel);
  border:1px solid var(--border);border-radius:10px;padding:11px 13px;box-shadow:0 14px 36px rgba(0,0,0,.32);
  font-size:12px;line-height:1.55;color:var(--text-dim);font-weight:400;text-align:start}
.help-pop .ht{font-weight:700;color:var(--text);margin-bottom:4px;font-size:12px}
.help-pop a{color:var(--brand)}
.help-pop .more{display:inline-block;margin-top:7px;font-size:11px}
/* Direct vs inherited assignment rows */
.asg{display:flex;flex-direction:column;gap:5px;max-height:280px;overflow:auto;padding:2px}
.asg label,.asg .ro{display:flex;gap:9px;align-items:center;padding:8px 10px;border:1px solid var(--border);
  border-radius:9px;cursor:pointer;font-size:12px}
.asg .ro{cursor:default;opacity:.85;background:var(--panel-2,rgba(127,127,127,.06))}
.asg .tagi{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--text-faint);margin-inline-start:auto;flex:none}
.asg .none{color:var(--text-faint);font-size:12px;padding:8px 2px}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{max-width:220px}
.content{padding:24px 26px;max-width:1220px;width:100%}
@media(min-width:1400px){.content{max-width:1320px}}

/* ---- cards / tiles ---- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.pad{padding:20px}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.section-head h3{margin:0;font-size:16px}
.section-head .spacer{flex:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--gap);margin-bottom:var(--gap)}
.tile{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.tile .ic{position:absolute;inset-inline-end:16px;top:16px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile .ic svg{width:19px;height:19px}
.tile .lbl{font-size:12px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.tile .val{font-size:30px;font-weight:750;letter-spacing:-1px;margin-top:6px;line-height:1}
.tile .sub{font-size:11.5px;color:var(--text-faint);margin-top:5px}

/* ---- tables ---- */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table.tbl{width:100%;border-collapse:collapse;min-width:560px;background:var(--card)}
table.tbl th{text-align:start;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);
  font-weight:700;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel-2);white-space:nowrap}
table.tbl td{padding:12px 16px;border-bottom:1px solid var(--border-soft);vertical-align:middle;font-size:13px}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr{transition:background .12s}
table.tbl tbody tr:hover{background:var(--panel-2)}
.t-actions{display:flex;gap:6px;justify-content:flex-end}
.t-mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--text-dim)}
.empty{padding:44px 20px;text-align:center;color:var(--text-faint)}
.empty svg{width:40px;height:40px;opacity:.4;margin-bottom:10px}

/* ---- pills ---- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;line-height:1.5;white-space:nowrap}
.pill .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.green{color:var(--ok);background:rgba(39,209,124,.14)}
.pill.red{color:var(--err);background:rgba(255,77,77,.14)}
.pill.grey{color:var(--muted-pill);background:rgba(123,130,144,.16)}
.pill.amber{color:var(--warn);background:rgba(255,176,32,.15)}
.pill.blue{color:var(--info);background:var(--accent-soft)}

/* ---- traffic bar ---- */
.tbar{width:120px;max-width:32vw}
.tbar .track{height:6px;border-radius:6px;background:var(--panel-2);overflow:hidden;border:1px solid var(--border-soft)}
.tbar .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.tbar .fill.warn{background:linear-gradient(90deg,#FFB020,var(--warn))}
.tbar .fill.over{background:linear-gradient(90deg,#FF4D4D,var(--err))}
.tbar .lbl{font-size:11px;color:var(--text-dim);margin-top:4px;font-family:ui-monospace,monospace}

/* ---- modal ---- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(6,9,15,.62);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:0 30px 70px -20px rgba(0,0,0,.7);animation:pop .18s cubic-bezier(.2,.9,.3,1);margin:auto 0}
.modal.wide{max-width:920px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--border-soft)}
.modal-head h3{margin:0;font-size:16.5px;flex:1}
.modal-body{padding:20px 22px;max-height:min(72vh,720px);overflow-y:auto}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--border-soft)}
.x-close{cursor:pointer;color:var(--text-faint);border:none;background:transparent;padding:4px;border-radius:8px;display:grid;place-items:center}
.x-close:hover{color:var(--err);background:rgba(255,77,77,.1)}
.x-close svg{width:18px;height:18px}

/* ---- forms grid ---- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.inp-group{display:flex;gap:8px}
.inp-group .input{flex:1}
.checklist{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow-y:auto;border:1px solid var(--input-border);border-radius:var(--radius-sm);padding:6px}
.checklist label{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500}
.checklist label:hover{background:var(--panel-2)}
.checklist input{accent-color:var(--accent);width:16px;height:16px}
.checklist .none{color:var(--text-faint);padding:10px;font-size:12.5px}

/* ---- preview / tabs / code ---- */
.split{display:grid;grid-template-columns:1fr 340px;gap:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border-soft);margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:transparent;border:none;color:var(--text-dim);padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.active{color:var(--accent);border-color:var(--accent)}
.code{background:var(--input);border:1px solid var(--input-border);border-radius:var(--radius-sm);padding:12px 14px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:pre;overflow-x:auto;color:var(--text-dim);max-height:340px;overflow-y:auto;line-height:1.55}
.code.wrap{white-space:pre-wrap;word-break:break-all}
.copybox{display:flex;gap:8px;align-items:stretch}
.copybox .code{flex:1;margin:0}
.uri-line{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all;background:var(--input);border:1px solid var(--input-border);padding:10px 12px;border-radius:9px;color:var(--accent-2)}
.qr{display:block;border-radius:10px;border:1px solid var(--border);background:#fff}
.qr-box{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius)}
.findings{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.finding{display:flex;gap:8px;align-items:flex-start;font-size:12px;padding:8px 10px;border-radius:8px}
.finding.error{background:rgba(255,77,77,.1);color:var(--err)}
.finding.warn{background:rgba(255,176,32,.1);color:var(--warn)}
.finding.info{background:var(--accent-soft);color:var(--accent)}
.finding svg{width:14px;height:14px;flex:none;margin-top:1px}

/* ---- misc ---- */
.subhead{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);margin:22px 0 10px}
.subhead:first-child{margin-top:0}
.stack{display:flex;flex-direction:column}
.pw-meter{height:6px;border-radius:4px;background:var(--border);margin-top:8px;overflow:hidden}
.pw-meter>span{display:block;height:100%;width:0;border-radius:4px;background:var(--danger,#e5484d);transition:width .18s,background .18s}
.pw-meter.s2>span{background:#e0a800}.pw-meter.s3>span{background:#3fb950}.pw-meter.s4>span{background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .12s}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.hot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:13px}
.kv:last-child{border:none}
.kv b{color:var(--text-dim);font-weight:600}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row .field{flex:1;min-width:150px;margin:0}
.spin{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;gap:10px;color:var(--text-dim);padding:40px;justify-content:center;font-size:13px}
.expander{border:1px solid var(--border);border-radius:var(--radius);margin-top:10px;overflow:hidden}
.expander>summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:13px;list-style:none;display:flex;align-items:center;gap:8px;background:var(--panel-2)}
.expander>summary::-webkit-details-marker{display:none}
.expander>summary .chev{transition:.2s;width:14px;height:14px}
.expander[open]>summary .chev{transform:rotate(90deg)}
.expander .exp-body{padding:16px}
.badge-count{background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:1px 8px;font-size:11px;font-weight:700}

/* ---- toasts ---- */
.toasts{position:fixed;top:16px;inset-inline-end:16px;z-index:9999;display:flex;flex-direction:column;gap:10px;max-width:340px}
.toast{display:flex;align-items:flex-start;gap:10px;background:var(--panel);border:1px solid var(--border);border-inline-start:3px solid var(--muted-pill);
  border-radius:11px;padding:12px 14px;box-shadow:var(--shadow);font-size:13px;animation:slidein .2s ease;font-weight:500}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.toast.success{border-inline-start-color:var(--ok)}
.toast.error{border-inline-start-color:var(--err)}
.toast.info{border-inline-start-color:var(--accent)}
.toast svg{width:17px;height:17px;flex:none;margin-top:1px}
.toast.success svg{color:var(--ok)}.toast.error svg{color:var(--err)}.toast.info svg{color:var(--accent)}

/* ---- responsive ---- */
.scrim{display:none}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset-block:0;inset-inline-start:0;width:264px;z-index:60;transform:translateX(-110%);transition:transform .22s ease}
  html[dir="rtl"] .sidebar{transform:translateX(110%)}
  .app.nav-open .sidebar{transform:none;box-shadow:0 0 60px rgba(0,0,0,.5)}
  .app.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55}
  .topbar .hamburger{display:inline-grid}
  .split{grid-template-columns:1fr}
  .content{padding:18px 15px}
}
@media(max-width:520px){
  .form-grid{grid-template-columns:1fr}
  .topbar{padding:10px 14px}
  .topbar h2{font-size:15px}
  .health span.txt{display:none}
  .modal-body{padding:16px}
  .tile .val{font-size:26px}
}
.hide{display:none!important}

<body>
<div id="root"></div>
<div class="toasts" id="toasts"></div>
<script>
"use strict";
/* ============================================================================
   ForgePanel admin SPA. Organised as: (1) self-contained QR generator,
   (2) tiny helpers (dom/format/escape), (3) API client + auth, (4) UI atoms
   (toast/modal/confirm), (5) the router + shell, (6) one render function per
   view. No framework, no external assets — everything the strict CSP forbids.
   ========================================================================== */

/* ---------------------------------------------------------------------------
   (1) QR CODE GENERATOR — byte mode, auto version 1..40, auto mask.
   Faithful port of Nayuki's public-domain algorithm (Reed-Solomon over GF(256),
   penalty-scored mask selection). Self-contained so client links / sub URLs /
   otpauth URLs render offline. Returns {size, modules[y][x]:bool(dark)}.
   --------------------------------------------------------------------------- */
const QR = (function(){
  // ECC levels: ord = table row (L,M,Q,H); fb = format bit pattern.
  const ECL = {L:{ord:0,fb:1}, M:{ord:1,fb:0}, Q:{ord:2,fb:3}, H:{ord:3,fb:2}};
  const ECCW = [ // error-correction codewords per block, indexed [ord][version]
    [-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
    [-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30]];
  const NBLK = [ // number of EC blocks, indexed [ord][version]
    [-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
    [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
    [-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
    [-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81]];

  function rawModules(v){ let r=(16*v+128)*v+64; if(v>=2){const a=Math.floor(v/7)+2; r-=(25*a-10)*a-55; if(v>=7) r-=36;} return r; }
  function dataCodewords(v,o){ return Math.floor(rawModules(v)/8) - ECCW[o][v]*NBLK[o][v]; }
  function rsMul(x,y){ let z=0; for(let i=7;i>=0;i--){ z=(z<<1)^((z>>>7)*0x11D); z^=((y>>>i)&1)*x; } return z&0xFF; }
  function rsDivisor(deg){ const r=new Array(deg).fill(0); r[deg-1]=1; let root=1;
    for(let i=0;i<deg;i++){ for(let j=0;j<r.length;j++){ r[j]=rsMul(r[j],root); if(j+1<r.length) r[j]^=r[j+1]; } root=rsMul(root,2); } return r; }
  function rsRemainder(data,div){ const res=div.map(()=>0);
    for(const b of data){ const f=b^res.shift(); res.push(0); div.forEach((c,i)=>res[i]^=rsMul(c,f)); } return res; }
  function alignPositions(v,size){ if(v===1) return [];
    const n=Math.floor(v/7)+2, step=(v===32)?26:Math.ceil((v*4+4)/(n*2-2))*2, r=[6];
    for(let pos=size-7; r.length<n; pos-=step) r.splice(1,0,pos); return r; }

  function encode(text, ecl){
    ecl = ecl || ECL.M;
    const data = Array.from(new TextEncoder().encode(String(text)));
    let v; for(v=1;;v++){ const cap=dataCodewords(v,ecl.ord)*8, cc=(v<=9)?8:16;
      if(4+cc+data.length*8 <= cap) break; if(v>=40) throw new Error("QR: data too long"); }
    // bit buffer -> data codewords (byte mode)
    const bb=[]; const put=(val,len)=>{ for(let i=len-1;i>=0;i--) bb.push((val>>>i)&1); };
    put(4,4); put(data.length,(v<=9)?8:16); data.forEach(b=>put(b,8));
    const cap=dataCodewords(v,ecl.ord)*8;
    put(0,Math.min(4,cap-bb.length)); put(0,(8-bb.length%8)%8);
    for(let pad=0xEC; bb.length<cap; pad^=0xEC^0x11) put(pad,8);
    const dcw=new Array(bb.length>>3).fill(0); bb.forEach((bit,i)=>dcw[i>>3]|=bit<<(7-(i&7)));
    // interleave data + ecc
    const all = interleave(dcw,v,ecl);
    return draw(all,v,ecl);
  }
  function interleave(data,v,ecl){
    const nb=NBLK[ecl.ord][v], ecl_len=ECCW[ecl.ord][v], raw=Math.floor(rawModules(v)/8);
    const nShort=nb-raw%nb, shortLen=Math.floor(raw/nb), div=rsDivisor(ecl_len), blocks=[];
    for(let i=0,k=0;i<nb;i++){ const dat=data.slice(k,k+shortLen-ecl_len+(i<nShort?0:1)); k+=dat.length;
      const ecc=rsRemainder(dat.slice(),div.slice()); if(i<nShort) dat.push(0); blocks.push(dat.concat(ecc)); }
    const out=[];
    for(let i=0;i<blocks[0].length;i++) blocks.forEach((blk,j)=>{ if(i!==shortLen-ecl_len||j>=nShort) out.push(blk[i]); });
    return out;
  }
  function draw(codewords,v,ecl){
    const size=v*4+17, mod=[], fn=[];
    for(let i=0;i<size;i++){ mod.push(new Array(size).fill(false)); fn.push(new Array(size).fill(false)); }
    const setF=(x,y,d)=>{ if(x>=0&&x<size&&y>=0&&y<size){ mod[y][x]=d; fn[y][x]=true; } };
    // timing patterns first, then finder patterns (finders overwrite the timing
    // modules that fall inside the corners — order matters, per the QR spec).
    for(let i=0;i<size;i++){ setF(6,i,i%2===0); setF(i,6,i%2===0); } // timing
    const finder=(cx,cy)=>{ for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){ const d=Math.max(Math.abs(dx),Math.abs(dy)); setF(cx+dx,cy+dy,d!==2&&d!==4); } };
    finder(3,3); finder(size-4,3); finder(3,size-4);
    const ap=alignPositions(v,size); // alignment
    for(let i=0;i<ap.length;i++) for(let j=0;j<ap.length;j++){
      if((i===0&&j===0)||(i===0&&j===ap.length-1)||(i===ap.length-1&&j===0)) continue;
      for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++) setF(ap[j]+dx,ap[i]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);
    }
    function fmt(mask){ let d=(ecl.fb<<3)|mask, rem=d; for(let i=0;i<10;i++) rem=(rem<<1)^((rem>>>9)*0x537);
      const bits=((d<<10)|rem)^0x5412;
      for(let i=0;i<=5;i++) setF(8,i,((bits>>>i)&1)!==0);
      setF(8,7,((bits>>>6)&1)!==0); setF(8,8,((bits>>>7)&1)!==0); setF(7,8,((bits>>>8)&1)!==0);
      for(let i=9;i<15;i++) setF(14-i,8,((bits>>>i)&1)!==0);
      for(let i=0;i<8;i++) setF(size-1-i,8,((bits>>>i)&1)!==0);
      for(let i=8;i<15;i++) setF(8,size-15+i,((bits>>>i)&1)!==0);
      setF(8,size-8,true);
    }
    function ver(){ if(v<7) return; let rem=v; for(let i=0;i<12;i++) rem=(rem<<1)^((rem>>>11)*0x1F25);
      const bits=(v<<12)|rem; for(let i=0;i<18;i++){ const bit=((bits>>>i)&1)!==0, a=size-11+i%3, b=Math.floor(i/3); setF(a,b,bit); setF(b,a,bit); } }
    fmt(0); ver();
    // place data codewords in zigzag
    let bi=0;
    for(let right=size-1;right>=1;right-=2){ if(right===6) right=5;
      for(let vert=0;vert<size;vert++) for(let j=0;j<2;j++){ const x=right-j, up=((right+1)&2)===0, y=up?size-1-vert:vert;
        if(!fn[y][x]&&bi<codewords.length*8){ mod[y][x]=((codewords[bi>>3]>>>(7-(bi&7)))&1)!==0; bi++; } } }
    function applyMask(m){ for(let y=0;y<size;y++) for(let x=0;x<size;x++){ if(fn[y][x]) continue; let inv;
      switch(m){ case 0:inv=(x+y)%2===0;break; case 1:inv=y%2===0;break; case 2:inv=x%3===0;break; case 3:inv=(x+y)%3===0;break;
        case 4:inv=(Math.floor(x/3)+Math.floor(y/2))%2===0;break; case 5:inv=(x*y)%2+(x*y)%3===0;break;
        case 6:inv=((x*y)%2+(x*y)%3)%2===0;break; case 7:inv=((x+y)%2+(x*y)%3)%2===0;break; }
      if(inv) mod[y][x]=!mod[y][x]; } }
    // choose lowest-penalty mask
    let best=0,min=Infinity;
    for(let m=0;m<8;m++){ applyMask(m); fmt(m); const p=penalty(mod,size); if(p<min){min=p;best=m;} applyMask(m); }
    applyMask(best); fmt(best);
    return {size:size, modules:mod};
  }
  // Nayuki penalty scoring (runs, 2x2 blocks, finder-like patterns, dark balance)
  function penalty(mod,size){
    const N1=3,N2=3,N3=40,N4=10; let res=0;
    const addH=(run,h)=>{ if(h[0]===0) run+=size; h.pop(); h.unshift(run); };
    const countP=(h)=>{ const n=h[1], core=n>0&&h[2]===n&&h[3]===n*3&&h[4]===n&&h[5]===n;
      return (core&&h[0]>=n*4&&h[6]>=n?1:0)+(core&&h[6]>=n*4&&h[0]>=n?1:0); };
    const term=(col,run,h)=>{ if(col){ addH(run,h); run=0; } run+=size; addH(run,h); return countP(h); };
    for(let y=0;y<size;y++){ let col=false,run=0,h=[0,0,0,0,0,0,0];
      for(let x=0;x<size;x++){ if(mod[y][x]===col){ run++; if(run===5) res+=N1; else if(run>5) res++; }
        else { addH(run,h); if(!col) res+=countP(h)*N3; col=mod[y][x]; run=1; } } res+=term(col,run,h)*N3; }
    for(let x=0;x<size;x++){ let col=false,run=0,h=[0,0,0,0,0,0,0];
      for(let y=0;y<size;y++){ if(mod[y][x]===col){ run++; if(run===5) res+=N1; else if(run>5) res++; }
        else { addH(run,h); if(!col) res+=countP(h)*N3; col=mod[y][x]; run=1; } } res+=term(col,run,h)*N3; }
    for(let y=0;y<size-1;y++) for(let x=0;x<size-1;x++){ const c=mod[y][x];
      if(c===mod[y][x+1]&&c===mod[y+1][x]&&c===mod[y+1][x+1]) res+=N2; }
    let dark=0; for(let y=0;y<size;y++) for(let x=0;x<size;x++) if(mod[y][x]) dark++;
    const total=size*size, k=Math.ceil(Math.abs(dark*20-total*10)/total)-1; res+=k*N4;
    return res;
  }
  // Render to an inline SVG string (crisp, high-contrast so it scans in any theme).
  function svg(text, px){ px=px||160; let m;
    try{ m=encode(text,ECL.M); }catch(e){ try{ m=encode(text,ECL.L); }catch(e2){ return '<div class="hint">value too large for QR</div>'; } }
    const n=m.size, b=4, dim=n+2*b; let d='';
    for(let y=0;y<n;y++) for(let x=0;x<n;x++) if(m.modules[y][x]) d+='M'+(x+b)+' '+(y+b)+'h1v1h-1z';
    return '<svg class="qr" width="'+px+'" height="'+px+'" viewBox="0 0 '+dim+' '+dim+'" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">'
      +'<rect width="'+dim+'" height="'+dim+'" fill="#ffffff"/><path d="'+d+'" fill="#0b0e14"/></svg>';
  }
  return {encode, svg, ECL};
})();

/* ---------------------------------------------------------------------------
   (2) HELPERS — DOM, escaping, formatting. Kept tiny and dependency-free.
   --------------------------------------------------------------------------- */
const $ = (sel,ctx)=>(ctx||document).querySelector(sel);
const $$ = (sel,ctx)=>Array.from((ctx||document).querySelectorAll(sel));
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// h(): terse element factory. attrs may include on{Event}, html, class, style.
function h(tag,attrs,kids){ const e=document.createElement(tag); attrs=attrs||{};
  for(const k in attrs){ const v=attrs[k];
    if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k==='text') e.textContent=v;
    else if(k==='style'&&typeof v==='object') Object.assign(e.style,v);
    else if(k.slice(0,2)==='on'&&typeof v==='function') e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='dataset') Object.assign(e.dataset,v);
    else e.setAttribute(k,v); }
  (Array.isArray(kids)?kids:[kids]).forEach(c=>{ if(c==null||c===false) return;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e; }
function clear(el){ while(el.firstChild) el.removeChild(el.firstChild); return el; }

function fmtBytes(b){ b=Number(b)||0; if(b===0) return '0 B';
  const u=['B','KB','MB','GB','TB'], i=Math.min(u.length-1,Math.floor(Math.log(b)/Math.log(1024)));
  return (b/Math.pow(1024,i)).toFixed(i?2:0).replace(/\.00$/,'')+' '+u[i]; }
function fmtGB(b){ return (Number(b||0)/1073741824); }
function fmtDate(s){ if(!s) return '—'; const d=new Date(s); if(isNaN(d)) return '—';
  return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
function fmtRel(s){ if(!s) return 'never'; const d=new Date(s), diff=(Date.now()-d)/1000;
  if(isNaN(d)) return 'never'; if(diff<60) return 'just now'; if(diff<3600) return Math.floor(diff/60)+'m ago';
  if(diff<86400) return Math.floor(diff/3600)+'h ago'; return Math.floor(diff/86400)+'d ago'; }
function copyText(txt){ if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(txt).then(()=>true).catch(()=>fallbackCopy(txt));
  return Promise.resolve(fallbackCopy(txt)); }
function fallbackCopy(txt){ try{ const ta=h('textarea',{style:{position:'fixed',opacity:'0'}}); ta.value=txt; document.body.appendChild(ta);
  ta.select(); document.execCommand('copy'); document.body.removeChild(ta); return true; }catch(e){ return false; } }

/* ---------------------------------------------------------------------------
   (3) STATE + API CLIENT — token in memory & localStorage; auto refresh once
   on 401, then fall back to the login screen. All calls are same-origin.
   --------------------------------------------------------------------------- */
const state={
  token:localStorage.getItem('fp_token')||'',
  refresh:localStorage.getItem('fp_refresh')||'',
  role:localStorage.getItem('fp_role')||'',
  theme:localStorage.getItem('fp_theme')||'dark',
  lang:localStorage.getItem('fp_lang')||'en',
  view:'', poll:null, inbounds:[], schema:null
};
function setTokens(access,refresh,role){ state.token=access||''; if(refresh) state.refresh=refresh; if(role) state.role=role;
  localStorage.setItem('fp_token',state.token); localStorage.setItem('fp_refresh',state.refresh); if(role) localStorage.setItem('fp_role',role); }
function clearTokens(){ state.token=state.refresh=state.role=''; localStorage.removeItem('fp_token'); localStorage.removeItem('fp_refresh'); localStorage.removeItem('fp_role'); }

class ApiError extends Error{ constructor(status,msg,data){ super(msg||('HTTP '+status)); this.status=status; this.data=data; } }

async function api(path,opts){ opts=opts||{};
  const headers=Object.assign({},opts.headers||{});
  let body=opts.body;
  if(body!=null&&typeof body!=='string'){ body=JSON.stringify(body); headers['Content-Type']='application/json'; }
  if(state.token) headers['Authorization']='Bearer '+state.token;
  const res=await fetch(path,{method:opts.method||'GET',headers:headers,body:body});
  if(res.status===401&&!opts._retried&&state.refresh){ if(await tryRefresh()){ opts._retried=true; return api(path,opts); } }
  if(res.status===401){ clearTokens(); route('login'); throw new ApiError(401,'Session expired'); }
  const txt=await res.text(); let data=null;
  if(txt){ try{ data=JSON.parse(txt); }catch(e){ data=txt; } }
  if(!res.ok){ const msg=(data&&data.error)||(typeof data==='string'&&data)||res.statusText||('HTTP '+res.status); throw new ApiError(res.status,msg,data); }
  return data;
}
async function tryRefresh(){ try{
  const res=await fetch('/api/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:state.refresh})});
  if(!res.ok) return false; const d=await res.json(); if(!d.access_token) return false;
  setTokens(d.access_token,d.refresh_token,state.role); return true;
}catch(e){ return false; } }

/* ---------------------------------------------------------------------------
   (4) UI ATOMS — toast, modal, confirm, and a few shared render helpers.
   --------------------------------------------------------------------------- */
function toast(msg,kind){ kind=kind||'info';
  const ico={success:'check',error:'alert',info:'info'}[kind]||'info';
  const el=h('div',{class:'toast '+kind,html:icon(ico)}); el.appendChild(h('div',{text:msg}));
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s,transform .3s'; el.style.opacity='0'; el.style.transform='translateX(20px)'; setTimeout(()=>el.remove(),300); },3600);
}
// modal(): returns {root, body, close}. onOk may return false / a rejected
// promise to keep the modal open (used for validation).
function modal(opt){ opt=opt||{};
  const body=h('div',{class:'modal-body'}); if(typeof opt.body==='string') body.innerHTML=opt.body; else if(opt.body) body.appendChild(opt.body);
  const foot=h('div',{class:'modal-foot'});
  const card=h('div',{class:'modal'+(opt.wide?' wide':'')},[
    h('div',{class:'modal-head'},[h('h3',{text:opt.title||''}),h('button',{class:'x-close',html:icon('x'),onClick:close})]),
    body
  ]);
  const overlay=h('div',{class:'overlay',onClick:e=>{ if(e.target===overlay&&opt.dismissable!==false) close(); }},[card]);
  let okBtn=null;
  if(!opt.hideFooter){
    if(opt.cancelText!==null){ foot.appendChild(h('button',{class:'btn',text:opt.cancelText||t('cancel'),onClick:close})); }
    okBtn=h('button',{class:'btn '+(opt.okKind||'primary'),text:opt.okText||t('save'),onClick:doOk});
    foot.appendChild(okBtn); card.appendChild(foot);
  }
  document.body.appendChild(overlay); document.body.style.overflow='hidden';
  const first=body.querySelector('input,select,textarea'); if(first) setTimeout(()=>first.focus(),40);
  function close(){ overlay.remove(); document.body.style.overflow=''; document.removeEventListener('keydown',onKey); if(opt.onClose) opt.onClose(); }
  async function doOk(){ if(!opt.onOk){ close(); return; }
    okBtn.disabled=true; const old=okBtn.innerHTML; okBtn.innerHTML='<span class="spin"></span>';
    try{ const r=await opt.onOk({body,close}); if(r!==false) close(); }
    catch(e){ toast(e.message||'Error',(e&&e.status)?'error':'error'); }
    finally{ okBtn.disabled=false; okBtn.innerHTML=old; }
  }
  function onKey(e){ if(e.key==='Escape'&&opt.dismissable!==false) close(); if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&okBtn) doOk(); }
  document.addEventListener('keydown',onKey);
  return {root:overlay,body,close,okBtn};
}
function confirmDialog(msg,opt){ opt=opt||{}; return new Promise(res=>{
  const m=modal({title:opt.title||'Please confirm',body:'<p style="margin:0;color:var(--text-dim)">'+esc(msg)+'</p>',
    okText:opt.okText||t('del'),okKind:opt.okKind||'danger',cancelText:t('cancel'),
    onOk:()=>{ res(true); }, onClose:()=>res(false)});
  m.okBtn.focus();
});}

function copyBtn(getVal,cls){ return h('button',{class:'btn '+(cls||'sm'),html:icon('copy')+'<span>'+t('copy')+'</span>',
  onClick:async e=>{ const b=e.currentTarget; const ok=await copyText(typeof getVal==='function'?getVal():getVal);
    if(ok){ const old=b.innerHTML; b.innerHTML=icon('check')+'<span>'+t('copied')+'</span>'; setTimeout(()=>b.innerHTML=old,1400); } else toast('Copy failed','error'); }}); }

   translatable in one place, and means a setting's explanation lives next to

   to render it first.

   Each entry is {t: title, b: plain-language body, d: optional doc anchor}. The

  reset_strategy:{t:'Reset strategy',b:'When the used-traffic counter goes back to zero. "No reset" counts forever. The periodic options reset at the start of each day, week, month or year. Lifetime totals are kept either way, so a reset never hides past usage.'},

let openHelpPop=null;
function closeHelp(){ if(openHelpPop){ openHelpPop.remove(); openHelpPop=null;
  document.removeEventListener('keydown',helpKey,true); document.removeEventListener('click',helpAway,true); } }
function helpKey(e){ if(e.key==='Escape'){ e.stopPropagation(); closeHelp(); } }
function helpAway(e){ if(openHelpPop&&!openHelpPop.contains(e.target)&&!e.target.closest('.help-b')) closeHelp(); }
// helpIcon returns an accessible info button for a HELP key. It responds to
// click, Enter and Space — never hover alone, which touch and keyboard users
// cannot reach — and the popover is positioned to stay on screen.
function helpIcon(key){
  const e=HELP[key]; if(!e) return document.createComment('no help: '+key);
  const btn=h('button',{class:'help-b',type:'button',text:'i'});
  btn.setAttribute('aria-label','What is "'+e.t+'"?');
  btn.setAttribute('aria-expanded','false');
  btn.addEventListener('click',ev=>{ ev.preventDefault(); ev.stopPropagation();
    if(openHelpPop&&openHelpPop.dataset.key===key){ closeHelp(); btn.setAttribute('aria-expanded','false'); return; }
    closeHelp();
    const pop=h('div',{class:'help-pop',role:'dialog'});
    pop.dataset.key=key;
    pop.setAttribute('aria-label',e.t);
    pop.appendChild(h('div',{class:'ht',text:e.t}));
    pop.appendChild(h('div',{text:e.b}));
    if(e.d) pop.appendChild(h('a',{class:'more',href:DOCS_BASE+e.d,target:'_blank',rel:'noopener',text:'Learn more →'}));
    document.body.appendChild(pop);
    // Keep the bubble on screen in both directions and in RTL.
    const r=btn.getBoundingClientRect(), pw=pop.offsetWidth, ph=pop.offsetHeight;
    let left=Math.min(Math.max(8,r.left),window.innerWidth-pw-8);
    let top=r.bottom+7; if(top+ph>window.innerHeight-8) top=Math.max(8,r.top-ph-7);
    pop.style.left=left+'px'; pop.style.top=top+'px';
    openHelpPop=pop; btn.setAttribute('aria-expanded','true');
    document.addEventListener('keydown',helpKey,true);
    setTimeout(()=>document.addEventListener('click',helpAway,true),0);
  });
  return btn;
}
// fieldH is field() with a help affordance on the label.
function fieldH(label,control,req,helpKey){
  const f=field(label,control,req);
  // :scope > label so a control that itself contains labels (a checkbox list)
  // cannot steal the help icon from the field's own label.
  const lb=f.querySelector(':scope > label');
  if(lb&&helpKey) lb.appendChild(helpIcon(helpKey));
  return f;
}

/* ---------------------------------------------------------------------------
   (5) ROUTER + SHELL. Hash routing (#/dashboard …). The shell renders once;
   only the .content pane re-renders per view. Polling is per-view and cleared
   on navigation so we never leak timers.
   --------------------------------------------------------------------------- */
const NAV=[
  ['dashboard','dashboard'],['inbounds','inbounds'],['users','users'],['groups','groups'],
  ['nodes','nodes'],['certs','certs'],['forgedns','forgedns'],['engines','engines'],['deploy','deploy'],['settings','settings']];
const VIEWS={}; // filled by each view module: VIEWS[name] = async (content)=>{}

function applyTheme(){ document.documentElement.setAttribute('data-theme',state.theme); }
function applyLang(){ document.documentElement.lang=state.lang; document.documentElement.dir=(state.lang==='fa')?'rtl':'ltr'; }
function toggleTheme(){ state.theme=state.theme==='dark'?'light':'dark'; localStorage.setItem('fp_theme',state.theme); applyTheme(); renderShellChrome(); }
function toggleLang(){ state.lang=state.lang==='fa'?'en':'fa'; localStorage.setItem('fp_lang',state.lang); applyLang(); render(); }

function route(where){ if(where==='login'){ location.hash=''; renderLogin(); return; } location.hash='#/'+where; }
function currentView(){ const hash=(location.hash||'').replace(/^#\/?/,''); const v=hash.split('/')[0]||'dashboard'; return VIEWS[v]?v:'dashboard'; }

function stopPoll(){ if(state.poll){ clearInterval(state.poll); state.poll=null; } }
function poll(fn,ms){ stopPoll(); state.poll=setInterval(fn,ms||5000); }

function render(){ if(!state.token){ renderLogin(); return; } renderApp(); }

/* ---- Login screen ---------------------------------------------------------- */
function renderLogin(){ stopPoll();
  applyTheme(); applyLang();

  const btn=h('button',{class:'btn primary',style:{width:'100%',justifyContent:'center',padding:'11px'},text:t('signin')});
  const form=h('form',{onSubmit:submit},[
    errBox,
    h('div',{class:'field'},[h('label',{text:'Username'}),uInput]),
    h('div',{class:'field'},[h('label',{text:'Password'}),pInput]),
    totpField, btn]);
  const card=h('div',{class:'login-card'},[
    h('div',{class:'login-brand',html:brandLogo(40)+'<h1 class="wordmark"><span class="fg">Forge</span>Panel</h1>'}),
    h('div',{class:'login-sub',text:'Multi-protocol proxy control panel'}),
    form,
    h('div',{style:{textAlign:'center',marginTop:'18px'}},[themeMini(),langMini()])
  ]);
  root.appendChild(h('div',{class:'login-wrap'},[card]));
  async function submit(e){ e.preventDefault();
    const username=uInput.value.trim(), password=pInput.value, totp=$('#l-totp')?$('#l-totp').value.trim():'';
    if(!username||!password){ showErr('Enter username and password'); return; }
    btn.disabled=true; const old=btn.textContent; btn.innerHTML='<span class="spin"></span>';

      const payload={username,password}; if(totp) payload.totp=totp;
      const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      const data=await res.json().catch(()=>({}));
      if(!res.ok){ const m=(data&&data.error)||'Invalid credentials';
        if(/totp|2fa|two.?factor/i.test(m)){ totpField.classList.remove('hide'); $('#l-totp').focus(); showErr('Enter your 2FA code'); }
        else showErr(m);

      location.hash='#/dashboard'; renderApp();
    }catch(err){ showErr('Cannot reach server'); }
    finally{ btn.disabled=false; btn.textContent=old; }
  }
  function showErr(m){ errBox.textContent=m; errBox.classList.remove('hide'); }
  setTimeout(()=>uInput.focus(),50);
}

/* ---- First-run setup screen ------------------------------------------------
   Shown when no administrator exists yet. The operator creates the owner
   account, protected by the one-time setup token printed by the installer /
   server log. No password is ever generated for them. */
function pwStrength(pw){
  if(!pw) return {score:0,label:'Use ≥10 chars with a mix of letters, digits and symbols.'};
  let score=0; if(pw.length>=10) score++; if(pw.length>=14) score++;
  let classes=0; if(/[a-zA-Z]/.test(pw)) classes++; if(/[0-9]/.test(pw)) classes++; if(/[^a-zA-Z0-9]/.test(pw)) classes++;
  if(classes>=2) score++; if(classes>=3) score++;
  score=Math.max(1,Math.min(score,4));
  return {score,label:['','Too weak','Fair','Good','Strong'][score]};
}
function renderSetup(){ stopPoll(); applyTheme(); applyLang();
  const root=clear($('#root'));

  const tInput=h('input',{class:'input mono',id:'s-token',placeholder:'setup token from the installer / server log',autocomplete:'off'});
  const meter=h('div',{class:'pw-meter'},[h('span')]);
  const meterLbl=h('div',{class:'hint',style:{marginTop:'4px'},text:pwStrength('').label});
  pInput.addEventListener('input',()=>{ const s=pwStrength(pInput.value); meter.className='pw-meter s'+s.score; meter.firstChild.style.width=(s.score*25)+'%'; meterLbl.textContent=s.label; });
  const btn=h('button',{class:'btn primary',style:{width:'100%',justifyContent:'center',padding:'11px'},text:'Create administrator'});
  const form=h('form',{onSubmit:submit},[errBox,
    h('div',{class:'field'},[h('label',{text:'Admin username'}),uInput]),
    h('div',{class:'field'},[h('label',{text:'Password'}),pInput,meter,meterLbl]),
    h('div',{class:'field'},[h('label',{text:'Repeat password'}),p2Input]),
    h('div',{class:'field'},[h('label',{text:'Setup token'}),tInput]),
    btn]);
  const card=h('div',{class:'login-card'},[
    h('div',{class:'login-brand',html:brandLogo(40)+'<h1 class="wordmark"><span class="fg">Forge</span>Panel</h1>'}),
    h('div',{class:'login-sub',text:'First-run setup — create your administrator account'}),
    form,
    h('div',{style:{textAlign:'center',marginTop:'18px'}},[themeMini(),langMini()])]);
  root.appendChild(h('div',{class:'login-wrap'},[card]));
  async function submit(e){ e.preventDefault();
    const username=uInput.value.trim(), password=pInput.value, confirm=p2Input.value, token=tInput.value.trim();
    if(!username||!password){ showErr('Enter a username and password'); return; }
    if(password!==confirm){ showErr('Passwords do not match'); return; }

    btn.disabled=true; const old=btn.textContent; btn.innerHTML='<span class="spin"></span>';
    try{
      const res=await fetch('/api/setup/init',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,username,password,password_confirm:confirm})});
      const data=await res.json().catch(()=>({}));

}

/* ---------------------------------------------------------------------------
   SYSTEM HEALTH INDICATOR.

   This used to be a bare coloured dot driven by whichever view rendered last:
   the dashboard set it from the engine count, and opening the ForgeDNS page
   overwrote it with that subsystem's state. So a perfectly healthy panel showed
   red whenever it had no inbounds yet or no DNS zones configured — a warning
   light with no label, no explanation and nothing to click, which teaches people
   to ignore warning lights.

   It is now backed by /api/admin/health/detail. Three rules:
     - the state is always accompanied by text, never signalled by colour alone;
     - "not configured" is a normal state and never shows as a fault;
     - every row says which subsystem it is, what is wrong, and where to look.
   --------------------------------------------------------------------------- */
const HSTATE={
  healthy:{label:'Healthy'},warning:{label:'Warning'},critical:{label:'Critical'},
  not_configured:{label:'Not configured'},unknown:{label:'Unknown'}
};
let lastHealth=null, healthPop=null;
function closeHealthPop(){ if(healthPop){ healthPop.remove(); healthPop=null;
  const el=$('#health'); if(el) el.setAttribute('aria-expanded','false'); } }
function renderHealthPop(){
  closeHealthPop();
  const el=$('#health'); if(!el||!lastHealth) return;
  const pop=h('div',{class:'hpop',role:'dialog','aria-label':'System health details'});
  (lastHealth.subsystems||[]).forEach(s=>{
    const row=h('div',{class:'hrow s-'+(s.state||'unknown')});
    row.appendChild(h('span',{class:'d'}));
    const b=h('div',{class:'b'});
    // The state is spelled out in text next to the name, so the colour is a
    // redundant cue rather than the only one.
    b.appendChild(h('div',{class:'nm'},[h('span',{text:s.label}),
      h('span',{class:'st',text:(HSTATE[s.state]||HSTATE.unknown).label})]));
    b.appendChild(h('div',{class:'sm',text:s.summary||''}));
    if(s.detail) b.appendChild(h('div',{class:'dt',text:s.detail}));
    row.appendChild(b); pop.appendChild(row);
  });
  el.appendChild(pop); healthPop=pop; el.setAttribute('aria-expanded','true');
  setTimeout(()=>document.addEventListener('click',healthAway,true),0);
}
function healthAway(e){ if(healthPop&&!e.target.closest('#health')){
  closeHealthPop(); document.removeEventListener('click',healthAway,true); } }
function paintHealth(rep){
  lastHealth=rep; const el=$('#health'); if(!el) return;
  const st=rep&&rep.state?rep.state:'unknown';
  const label=(HSTATE[st]||HSTATE.unknown).label;
  el.className='health s-'+st;
  el.innerHTML='<span class="dot"></span><span class="txt">'+esc(label)+'</span><span class="caret">▾</span>';
  // Accessible name carries the full sentence, so a screen reader gets the
  // meaning without the colour.
  el.setAttribute('aria-label','System health: '+label+'. '+(rep&&rep.summary?rep.summary:''));
  el.title=(rep&&rep.summary)||label;
  if(healthPop) renderHealthPop(); // keep an open panel current
}
async function refreshHealth(){
  try{ paintHealth(await api('/api/admin/health/detail')); }
  catch(e){ paintHealth({state:'unknown',summary:'Could not reach the panel API.',
    subsystems:[{key:'api',label:'Panel API',state:'unknown',
      summary:'The health check itself failed.',detail:e&&e.message?e.message:''}]}); }
}
document.addEventListener('click',e=>{ const el=e.target.closest&&e.target.closest('#health');
  if(!el) return; if(healthPop){ closeHealthPop(); document.removeEventListener('click',healthAway,true); }
  else renderHealthPop(); });
document.addEventListener('keydown',e=>{ if(!$('#health')) return;
  if(e.key==='Escape'&&healthPop){ closeHealthPop(); return; }
  if((e.key==='Enter'||e.key===' ')&&document.activeElement&&document.activeElement.id==='health'){
    e.preventDefault(); if(healthPop) closeHealthPop(); else renderHealthPop(); } });

/* keyboard quick-nav: g then d/i/u/g/n/c/f/s */
let gKey=false, gTimer=null;
document.addEventListener('keydown',e=>{
  if(!state.token) return; const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='g'){ gKey=true; clearTimeout(gTimer); gTimer=setTimeout(()=>gKey=false,900); return; }
  if(gKey){ const map={d:'dashboard',i:'inbounds',u:'users',g:'groups',n:'nodes',c:'certs',f:'forgedns',s:'settings'};
    if(map[e.key]){ gKey=false; route(map[e.key]); } }
});

      if(!engines||!engines.length){ engineCard.appendChild(emptyEl('No engines started — add an inbound to spin one up')); }
      else engines.forEach(e=>{
        const st=e.state, cls=st==='running'?'green':(st==='stopped'?'grey':'red');
        engineCard.appendChild(h('div',{class:'kv',html:
          '<b>'+esc(e.engine)+'</b><span>'+pill(cls,st.replace('_',' '))

/* The inbound schema addresses node fields by dot-path ("security.reality.dest",
   "hysteria2.obfs_type") so the form can be generated from /api/protocols/schema
   without this file knowing a single protocol. setPath creates the intermediate
   objects on the way down; the server fills in anything we leave unset. */
function setPath(obj,path,val){ const parts=path.split('.'); let o=obj;
  for(let i=0;i<parts.length-1;i++){ const k=parts[i];
    if(!o[k]||typeof o[k]!=='object') o[k]={}; o=o[k]; }
  o[parts[parts.length-1]]=val; return obj; }

function findingsEl(errors){ const wrap=h('div',{class:'findings'});

/* The New-Inbound modal: a protocol form on the left, a byte-identical live
   preview (link + QR + engine JSON) on the right, driven by the same
   /api/studio/preview the panel deploys through.

   Every input below is generated from /api/protocols/schema — this file knows
   nothing about individual protocols, so whatever the backend can express is
   creatable here. `vals` is keyed by the schema's dot-path, which is also the
   path into the node JSON we POST, and it survives protocol/transport switches
   so nothing typed is lost while exploring. A `seed` node prefills the form
   (edit / clone); create passes none. */
// Protocol-switch: preview what converting an existing inbound to another
// protocol keeps / resets / regenerates, then (if the result validates) seed a
// new-inbound form with it. The original inbound is never mutated — the backend
// has no in-place edit, and a silent delete+recreate would drop live users.
const SWITCH_ENGINE={vless:'xray',vmess:'xray',trojan:'xray',shadowsocks:'xray',socks:'xray',http:'xray',
  hysteria2:'sing-box',tuic:'sing-box',anytls:'sing-box',shadowtls:'sing-box',wireguard:'sing-box',ssh:'sing-box',brook:'brook'};
async function switchProtocolModal(r,onSaved){
  const node=r.node||{}; const cur=(r.protocol||node.protocol||'').toLowerCase();
  const protos=['vless','vmess','trojan','shadowsocks','socks','http','hysteria2','tuic','anytls','shadowtls','wireguard','brook'];
  const opts=protos.filter(p=>p!==cur).map(p=>[p,p.toUpperCase()]);
  const targetSel=sel('sw-target',opts,opts[0]&&opts[0][0]);
  const out=h('div',{style:{marginTop:'12px'}});
  let previewNode=null, ok=false;
  function fieldList(title,arr,color){
    if(!arr||!arr.length) return null;
    return h('div',{style:{marginTop:'10px'}},[h('div',{class:'subhead',style:{margin:'0 0 6px'},html:esc(title)+' '+pill(color,String(arr.length))}),
      h('div',{class:'stack'},arr.map(fc=>h('div',{class:'kv'},[h('span',{class:'t-mono',text:fc.field}),h('span',{class:'hint',text:fc.why||fc.value||''})])))]);
  }
  function renderSummary(el,resp){
    clear(el); const s=resp.summary||{};
    el.appendChild(h('div',{class:'hint',html:pill('blue',(s.from_protocol||cur).toUpperCase())+' → '+pill('blue',(s.to_protocol||'').toUpperCase())
      +' &nbsp; '+(s.engine_changed?pill('amber','engine '+esc(s.from_engine)+' → '+esc(s.to_engine)):pill('grey','same engine · '+esc(s.to_engine||'')))
      +' &nbsp; '+(resp.valid?pill('green','valid'):pill('red','invalid'))}));
    if(!resp.valid&&resp.error) el.appendChild(h('div',{class:'hint',style:{color:'var(--danger,#e5484d)'},text:resp.error}));
    (s.warnings||[]).forEach(w=>el.appendChild(h('div',{class:'hint',html:pill('amber','warning')+' '+esc(w)})));
    [fieldList('Retained',s.retained,'green'),fieldList('Reset (cleared)',s.reset,'grey'),fieldList('Regenerated',s.regenerated,'blue')].forEach(x=>{ if(x) el.appendChild(x); });
    if((s.required_ports||[]).length) el.appendChild(h('div',{style:{marginTop:'10px'}},[h('div',{class:'subhead',style:{margin:'0 0 6px'},text:'Required ports'}),
      h('div',{class:'stack'},s.required_ports.map(p=>h('div',{class:'kv'},[h('span',{class:'t-mono',text:(p.proto||'').toUpperCase()+' '+(p.range||p.port||'')}),h('span',{class:'hint',text:p.note||''})])))]));
  }
  async function doPreview(){
    clear(out); out.appendChild(loadingEl('Previewing switch…')); ok=false; previewNode=null;
    try{ const resp=await api('/api/protocols/switch/preview',{method:'POST',body:{node:node,target_protocol:targetSel.value}});
      renderSummary(out,resp); previewNode=resp.node; ok=!!resp.valid;
    }catch(e){ clear(out); out.appendChild(h('div',{class:'hint',text:e.message})); }
  }
  targetSel.addEventListener('change',doPreview);
  const body=h('div',{},[
    h('div',{class:'hint',html:'Current: '+pill('blue',cur.toUpperCase())+' · engine '+esc(SWITCH_ENGINE[cur]||'?')
      +'. Applying opens a new-inbound form seeded with the converted node — the original stays until you delete it.'}),
    field('Switch to',targetSel), out]);
  const m=modal({title:'Switch protocol · '+(r.remark||cur),wide:true,body,okText:'Create switched inbound',onOk:()=>{
    if(!ok||!previewNode){ toast('Pick a target that produces a valid config','error'); return false; }

  }});
  doPreview();
}

function openInboundModal(onSaved,seed){
  const schema=state.schema||{};
  const protos=schema.protocols||[];
  if(!protos.length){ toast('Protocol schema unavailable — reload the page','error'); return; }
  const TR=schema.transports||{}, SEC=schema.securities||{};

  const vals={};                    // dot-path -> raw control value (string | bool)
  const touched={};                 // dot-paths the operator has edited themselves
  const base={remark:'',address:'',port:443};
  let cur=protos[0];                // selected protocol schema
  let net='', secName='';           // '' = this protocol has no transport / security layer
  if(seed){ seedFrom(seed); }
  else { cur=protos[0]; net=first(cur.transports); secName=first(cur.securities); }

  const formCol=h('div'); const dyn=h('div');
  const preview=h('div');
  const body=h('div',{class:'split'},[h('div',{},[formCol]),h('div',{},[h('div',{class:'card pad',style:{position:'sticky',top:'0'}},[h('div',{class:'subhead',text:'Live preview'}),preview])])]);

  // static fields — address is optional; the panel substitutes its public address.
  const protoSel=sel('i-proto',protos.map(p=>[p.proto,p.label||p.proto]),cur.proto);
  protoSel.onchange=()=>{ cur=protos.find(p=>p.proto===protoSel.value)||protos[0];
    net=first(cur.transports); secName=first(cur.securities); buildDyn(); schedule(); };
  const remarkI=inp('i-remark',{placeholder:'my-server',value:base.remark}); remarkI.oninput=()=>{base.remark=remarkI.value; schedule();};
  const addrI=inp('i-addr',{placeholder:'auto — panel public address',value:base.address}); addrI.oninput=()=>{base.address=addrI.value; schedule();};
  const portI=inp('i-port',{type:'number',min:1,max:65535,value:base.port}); portI.oninput=()=>{base.port=portI.value; schedule();};
  formCol.appendChild(h('div',{class:'form-grid'},[
    field('Protocol',protoSel), field('Remark',remarkI),
    field('Address',addrI), field('Port',portI)]));
  formCol.appendChild(dyn);

  function first(a){ return (a&&a.length)?a[0]:''; }
  // Fields on screen right now: protocol options + the selected transport's + the
  // selected security's. buildNode() reads exactly this set.
  function activeFields(){ return (cur.fields||[])
    .concat(net?(TR[net]||[]):[]).concat(secName?(SEC[secName]||[]):[]); }

  /* ---- one schema Field -> one labelled control ----------------------------
     Some paths are shared by several fields (security.server_name exists under
     both TLS and REALITY). Anything the operator has not edited takes the
     default of whichever field is on screen now; edited values are never
     clobbered, so switching protocol/transport back and forth is lossless. */
  function initVal(f){ if(touched[f.key]) return;
    if(vals[f.key]===undefined||f.default!=null)
      vals[f.key]=(f.type==='bool')?!!f.default:(f.default==null?'':String(f.default)); }
  function renderField(f){
    initVal(f);
    const id='f-'+f.key.replace(/[^a-zA-Z0-9]/g,'-');
    const full=f.type==='textarea'||f.type==='csv'||f.type==='csvint'||!!f.keygen;
    let el, node;
    const upd=()=>{ touched[f.key]=true; vals[f.key]=(f.type==='bool')?el.checked:el.value; schedule(); };
    if(f.type==='bool'){
      el=h('input',{type:'checkbox',id:id}); el.checked=!!vals[f.key]; el.onchange=upd;
      // reuse the .checklist look so a lone checkbox matches the group picker
      node=h('div',{class:'checklist'},[h('label',{},[el,h('span',{text:f.label})])]);
      const d=h('div',{class:'field'+(full?' full':'')},[node]);
      if(f.help) d.appendChild(h('div',{class:'hint',text:f.help}));
      return d;
    }
    if(f.type==='textarea'){ el=h('textarea',{class:'input',id:id,rows:5,placeholder:f.placeholder||''}); el.value=vals[f.key]; el.oninput=upd; }
    else if(f.type==='select'||f.type==='iselect'){
      let opts=f.options||[];
      // the schema normally supplies options; fall back to the shared uTLS list
      if(!opts.length&&/fingerprint$/.test(f.key)) opts=schema.fingerprints||[];
      el=sel(id,opts.map(o=>[o,o===''?'— none —':o]),String(vals[f.key])); el.onchange=upd;
    }
    else if(f.type==='number'){ el=inp(id,{type:'number',placeholder:f.placeholder||''}); el.value=vals[f.key]; el.oninput=upd; }
    else { el=inp(id,{placeholder:f.placeholder||(f.type==='csv'||f.type==='csvint'?'comma-separated':'')}); el.value=vals[f.key]; el.oninput=upd; }
    node=f.keygen?withGen(el,()=>doKeygen(f)):el;
    const d=h('div',{class:'field'+(full?' full':'')},[h('label',{text:f.label}),node]);
    if(f.help) d.appendChild(h('div',{class:'hint',text:f.help}));
    return d;
  }

  /* ---- keygen ------------------------------------------------------------
     A generator may fill two inputs (REALITY / WireGuard keypairs), so results
     land in `vals` and the form re-renders from there rather than poking DOM. */
  async function doKeygen(f){
    let kind=f.keygen;
    const hasMethod=activeFields().some(x=>x.key==='method'), method=hasMethod?String(vals['method']||''):'';
    // SS2022 PSKs must be exactly the cipher's key length — not a plain password.
    if((kind==='password'||kind==='ss2022')&&f.key==='password'&&method.indexOf('2022-')===0) kind='ss2022';
    let r; try{ r=await keygen(kind,kind==='ss2022'?{method:method}:null); }
    catch(e){ toast(e.message,'error'); return; }
    const put=(k,v)=>{ vals[k]=v||''; touched[k]=true; };
    if(kind==='reality'){ put('security.reality.private_key',r.private_key); put('security.reality.public_key',r.public_key); }
    else if(kind==='wireguard'){ put('wireguard.private_key',r.private_key); put('wireguard.public_key',r.public_key); }
    else if(kind==='ssh') put(f.key,r.private_key);
    else if(kind==='uuid') put(f.key,r.uuid);
    else if(kind==='shortid') put(f.key,r.short_id);
    else if(kind==='ss2022') put(f.key,r.psk);
    else put(f.key,r.password);
    buildDyn(); schedule();
  }

  function buildDyn(){ clear(dyn);
    if((cur.fields||[]).length){
      dyn.appendChild(h('div',{class:'subhead',text:(cur.label||cur.proto)+(cur.engine?' · '+cur.engine:'')}));
      const g=h('div',{class:'form-grid'});
      cur.fields.forEach(f=>g.appendChild(renderField(f)));
      dyn.appendChild(g);
    }
    if(cur.transports&&cur.transports.length){
      dyn.appendChild(h('div',{class:'subhead',text:'Transport'}));
      const tg=h('div',{class:'form-grid'});
      const netSel=sel('i-net',cur.transports,net); netSel.onchange=()=>{ net=netSel.value; buildDyn(); schedule(); };
      tg.appendChild(field('Network',netSel));
      (TR[net]||[]).forEach(f=>tg.appendChild(renderField(f)));
      dyn.appendChild(tg);
    }
    if(cur.securities&&cur.securities.length){
      dyn.appendChild(h('div',{class:'subhead',text:'Security'}));
      const sg=h('div',{class:'form-grid'});
      const secSel=sel('i-sec',cur.securities,secName); secSel.onchange=()=>{ secName=secSel.value; buildDyn(); schedule(); };
      sg.appendChild(field('Type',secSel));
      (SEC[secName]||[]).forEach(f=>sg.appendChild(renderField(f)));
      dyn.appendChild(sg);
    }
  }

  /* ---- value coercion + node assembly -------------------------------------
     Empty text/csv fields are left unset so the server's smart defaults apply
     (REALITY keys, UUIDs, passwords, dest…). Numbers and booleans always go. */
  function coerce(f){ const raw=vals[f.key];
    if(f.type==='bool') return {set:true,val:!!raw};
    if(f.type==='number'||f.type==='iselect') return {set:true,val:Number(String(raw==null?'':raw).trim())||0};
    if(f.type==='csv'||f.type==='csvint'){
      const a=String(raw==null?'':raw).split(',').map(s=>s.trim()).filter(Boolean);
      if(!a.length) return {set:false};
      return {set:true,val:f.type==='csvint'?a.map(Number):a};
    }
    const s=String(raw==null?'':raw);
    return s.trim()===''?{set:false}:{set:true,val:s};
  }
  function buildNode(){
    const n={protocol:cur.proto,port:Number(base.port)||0,remark:base.remark.trim()};
    const addr=base.address.trim(); if(addr) n.address=addr;
    // Protocols with no transport layer must not carry transport.network at all.
    if(net) setPath(n,'transport.network',net);
    if(secName) setPath(n,'security.type',secName);
    activeFields().forEach(f=>{ const c=coerce(f); if(c.set) setPath(n,f.key,c.val); });
    return n; }

  // Prefill from an existing node: same schema-driven fields, values read back
  // out of the node by the very dot-paths the form writes.
  function seedFrom(node){
    cur=protos.find(p=>p.proto===node.protocol)||protos[0];
    const netOf=(node.transport||{}).network||'';
    net=(cur.transports||[]).indexOf(netOf)>=0?netOf:first(cur.transports);
    const secOf=(node.security||{}).type||'';
    secName=(cur.securities||[]).indexOf(secOf)>=0?secOf:first(cur.securities);
    base.remark=node.remark||''; base.address=node.address||''; base.port=node.port||443;
    const read=p=>p.split('.').reduce((o,k)=>(o==null?undefined:o[k]),node);
    activeFields().forEach(f=>{ const v=read(f.key); if(v===undefined||v===null) return;
      vals[f.key]=(f.type==='bool')?!!v:(Array.isArray(v)?v.join(','):String(v)); touched[f.key]=true; });
  }

  // live preview (debounced)
  let timer=null, resp=null, tab='link';
  function schedule(){ clearTimeout(timer); timer=setTimeout(run,350); }
  async function run(){
    try{ resp=await api('/api/studio/preview',{method:'POST',body:buildNode()}); }
    catch(e){ resp={errors:[{severity:'error',message:e.message}]}; }
    drawPreview(); }
  function drawPreview(){ clear(preview);
    if(!resp){ preview.appendChild(h('div',{class:'hint',text:'Building preview…'})); return; }
    const tabs=h('div',{class:'tabs'});
    [['link','Link'],['xray','Xray'],['singbox','sing-box'],['clash','Clash']].forEach(([id,lbl])=>
      tabs.appendChild(h('button',{class:tab===id?'active':'',text:lbl,onClick:()=>{tab=id; drawPreview();}})));
    preview.appendChild(tabs);
    if(tab==='link'){
      if(resp.uri){ preview.appendChild(h('div',{class:'uri-line',text:resp.uri}));
        preview.appendChild(h('div',{style:{marginTop:'10px'}},[copyBtn(resp.uri)]));
        preview.appendChild(h('div',{class:'qr-box',style:{marginTop:'12px'},html:QR.svg(resp.uri,180)})); }
      else preview.appendChild(h('div',{class:'hint',text:'No client link for this protocol/params yet.'}));
    } else { const body={xray:resp.xray,singbox:resp.singbox,clash:resp.clash}[tab];
      preview.appendChild(h('div',{class:'code',text:body||'(nothing generated)'})); }
    if(resp.errors&&resp.errors.length) preview.appendChild(findingsEl(resp.errors));
  }

  buildDyn(); drawPreview();
  modal({title:t('newInbound'),wide:true,body,okText:t('create'),cancelText:t('cancel'),
    onOk:async()=>{ const p=Number(base.port); if(!p||p<1||p>65535){ toast('Port must be 1–65535','error'); return false; }
      await api('/api/admin/inbounds',{method:'POST',body:buildNode()}); toast('Inbound created','success'); if(onSaved) onSaved(); }});
  schedule();
}

const USTATUS={active:'green',limited:'amber',expired:'red',disabled:'grey',on_hold:'blue'};
function trafficCell(used,limit){ used=Number(used||0); limit=Number(limit||0);
  if(!limit) return '<div class="tbar"><div class="track"><div class="fill" style="width:6%;opacity:.35"></div></div><div class="lbl">'+fmtBytes(used)+' / ∞</div></div>';
  const pct=Math.min(100,used/limit*100), cls=pct>=100?'over':(pct>=85?'warn':'');
  return '<div class="tbar"><div class="track"><div class="fill '+cls+'" style="width:'+pct.toFixed(1)+'%"></div></div>'
    +'<div class="lbl">'+fmtBytes(used)+' / '+fmtBytes(limit)+'</div></div>'; }
VIEWS.users=async function(content){
  clear(content);
  const head=h('div',{class:'section-head'},[h('h3',{text:t('users')}),h('div',{class:'spacer'}),
    h('button',{class:'btn primary',html:icon('plus')+'<span>'+esc(t('newUser'))+'</span>',onClick:openNew})]);
  // Search / filter / sort. A panel with a few hundred accounts is unusable
  // without them, and they cost nothing on a small one.
  const q=inp('u-q',{placeholder:'Search username or UUID…'});
  const fStatus=sel('u-fs',[['','All statuses'],['active','Active'],['disabled','Disabled'],
    ['limited','Limited'],['expired','Expired'],['on_hold','On hold']],'');
  const fSort=sel('u-so',[['username','Sort: name'],['created','Sort: newest'],
    ['traffic','Sort: traffic used'],['expiry','Sort: expiry']],'username');
  const filters=h('div',{class:'filters'},[q,fStatus,fSort]);
  const tableWrap=h('div',{class:'table-wrap'});
  content.appendChild(head); content.appendChild(filters); content.appendChild(tableWrap);

  let rows=[], groups=[], inbounds=[];
  [q,fStatus,fSort].forEach(el=>el.addEventListener('input',draw));

  async function load(){
    tableWrap.innerHTML=''; tableWrap.appendChild(loadingEl());
    const [us,gs,ins]=await Promise.all([
      api('/api/admin/users'),
      api('/api/admin/groups').catch(()=>[]),
      api('/api/admin/inbounds').catch(()=>[])]);
    rows=us||[]; groups=gs||[]; inbounds=ins||[];
    draw();
  }

  function draw(){
    clear(tableWrap);
    if(!rows.length){
      // Empty states say what to do next rather than just reporting emptiness.
      tableWrap.appendChild(emptyEl('No users yet — create an account, then share its subscription link.'));
      return;
    }
    const needle=(q.value||'').trim().toLowerCase();
    let list=rows.filter(u=>{
      if(fStatus.value && (u.status||'active')!==fStatus.value) return false;
      if(!needle) return true;
      return (u.username||'').toLowerCase().includes(needle)||(u.uuid||'').toLowerCase().includes(needle);
    });
    const byName=(a,b)=>(a.username||'').localeCompare(b.username||'');
    ({username:()=>list.sort(byName),
      created:()=>list.sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''))),
      traffic:()=>list.sort((a,b)=>Number(b.used_traffic||0)-Number(a.used_traffic||0)),
      expiry:()=>list.sort((a,b)=>String(a.expire_at||'9999').localeCompare(String(b.expire_at||'9999')))
    }[fSort.value]||(()=>list.sort(byName)))();

    if(!list.length){ tableWrap.appendChild(emptyEl('No users match this search or filter.')); return; }
    const gname={}; groups.forEach(g=>gname[g.id]=g.name);
    const tbl=h('table',{class:'tbl'});
    tbl.appendChild(h('thead',{html:'<tr><th>Username</th><th>Status</th><th>Group</th><th>Traffic</th><th>Expires</th><th></th></tr>'}));
    const tb=h('tbody');
    list.forEach(u=>{
      const st=u.status||'active';
      const tr=h('tr');
      tr.innerHTML='<td><b>'+esc(u.username)+'</b><div class="t-mono" style="font-size:11px;color:var(--text-faint)">'+esc((u.uuid||'').slice(0,8))+'</div></td>'
        +'<td>'+pill(USTATUS[st]||'grey',st.replace('_',' '))+'</td>'
        +'<td>'+(u.group_id?esc(gname[u.group_id]||('#'+u.group_id)):'<span class="hint">no group</span>')+'</td>'
        +'<td>'+trafficCell(u.used_traffic,u.data_limit)+'</td>'
        +'<td class="t-mono">'+esc(u.expire_at?fmtDate(u.expire_at):'never')+'</td>';
      const act=h('td');
      // Icon-only actions carry a title AND an aria-label: an unlabelled icon is
      // a guessing game, and the destructive ones must never be guessed at.
      const ab=(ic,label,kind,fn)=>{
        const b=h('button',{class:'btn sm'+(kind?' '+kind:''),html:icon(ic),onClick:fn,title:label});
        b.setAttribute('aria-label',label); return b;
      };
      act.appendChild(h('div',{class:'t-actions'},[
        ab('settings','Edit user','',()=>openEdit(u.id)),
        ab('shield',st==='disabled'?'Enable user':'Disable user','',async()=>{
          const next=st==='disabled'?'active':'disabled';
          if(next==='disabled'&&!await confirmDialog('Disable "'+u.username+'"? They stop connecting immediately, but nothing is deleted.')) return;
          try{ await api('/api/admin/users/'+u.id,{method:'PATCH',body:{status:next}});
            toast(next==='active'?'User enabled':'User disabled','success'); load();
          }catch(e){ toast(e.message,'error'); } }),
        ab('copy','Copy subscription link','',async()=>{
          try{ const d=await api('/api/admin/users/'+u.id);
            const ok=await copyText(d.sub_url||('/sub/'+(d.user&&d.user.sub_token)));
            toast(ok?'Subscription link copied':'Copy failed',ok?'success':'error');
          }catch(e){ toast(e.message,'error'); } }),
        ab('trash','Delete user','danger',async()=>{
          if(await confirmDialog('Delete user "'+u.username+'"? Their subscription stops working immediately.')){
            try{ await api('/api/admin/users/'+u.id,{method:'DELETE'}); toast('User deleted','success'); load(); }
            catch(e){ toast(e.message,'error'); } } })
      ].filter(Boolean)));
      tr.appendChild(act); tb.appendChild(tr);
    });
    tbl.appendChild(tb); tableWrap.appendChild(tbl);
  }

  /* ---- Edit user ---------------------------------------------------------
     Every field the backend accepts is editable here. Two properties matter:
     the form sends only what changed, and it never touches credentials —
     rotating a subscription token breaks every client the user has configured,
     so that lives behind its own explicit action below. */
  async function openEdit(id){
    let d; try{ d=await api('/api/admin/users/'+id); }catch(e){ toast(e.message,'error'); return; }
    const u=d.user||{}, asg=d.assignments||{direct:[],inherited:[],effective:[]};
    const byId={}; inbounds.forEach(i=>byId[i.id]=i);

    const nameI=inp('e-name',{value:u.username||''});
    const statusS=sel('e-st',[['active','Active'],['disabled','Disabled'],['limited','Limited'],
      ['expired','Expired'],['on_hold','On hold']],u.status||'active');
    // "No group" is a first-class option, not an absence of one.
    const grpS=sel('e-grp',[['0','— No group —']].concat(groups.map(g=>[String(g.id),g.name])),String(u.group_id||0));
    const limI=inp('e-lim',{type:'number',min:0,value:String(Math.round((Number(u.data_limit||0))/1073741824*1000)/1000)});
    const resetS=sel('e-rs',[['no_reset','No reset'],['day','Daily'],['week','Weekly'],
      ['month','Monthly'],['year','Yearly'],['on_expire','On expiry']],u.reset_strategy||'no_reset');
    const expI=inp('e-exp',{type:'date',value:u.expire_at?String(u.expire_at).slice(0,10):''});
    const ipI=inp('e-ip',{type:'number',min:0,value:String(u.ip_limit||0)});
    const tgI=inp('e-tg',{type:'number',min:0,value:String(u.telegram_id||0)});
    const noteI=inp('e-note',{value:u.note||''});

    // Assignment editor: direct assignments are checkboxes; inherited ones are
    // shown read-only with a link to the group that grants them, because
    // removing one here would silently diverge this user from their group.
    const asgBox=h('div',{class:'asg'});
    const direct=new Set(asg.direct||[]);
    const inherited=new Set(asg.inherited||[]);
    function drawAsg(){
      clear(asgBox);
      if(!inbounds.length){ asgBox.appendChild(h('div',{class:'none',text:'No inbounds exist yet — create one first.'})); return; }
      inbounds.forEach(i=>{
        const label='<b>'+esc(i.remark||'(unnamed)')+'</b> · '+esc((i.protocol||'').toUpperCase())+' :'+esc(i.port)
