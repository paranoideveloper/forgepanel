# ForgePanel release matrix (spec §2/§14).
version: 2
builds:
  - id: forgepanel
    main: ./cmd/forgepanel
    binary: forgepanel
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - {goos: darwin, goarch: arm}
    ldflags: ["-s -w -X main.version={{.Version}}"]
  - id: forgectl
    main: ./cmd/forgectl
    binary: forgectl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    files: [README.md, LICENSE*, docs/*, deploy/install.sh]
checksum:
  name_template: "checksums.txt"
release:
  draft: true
