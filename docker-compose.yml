# ForgePanel — production Compose deployment, backed by the embedded (pure-Go)
# SQLite store. State lives in the named volume, so `docker compose down` keeps
# your users, inbounds and certificates; only `down -v` discards them.
#
#   docker compose up -d
#   docker compose logs -f forgepanel     # first boot prints the setup token
#
# Compose builds the checked-out, pinned release tag locally. This keeps the
# deployment usable when a private registry is unavailable and lets the same
# file build exactly the source you reviewed. Bump FORGEPANEL_VERSION only after
# checking out the matching release tag and reading its release notes.
services:
  forgepanel:
    image: forgepanel:${FORGEPANEL_VERSION:-v1.2.1}
    build:
      context: .
      args:
        VERSION: ${FORGEPANEL_VERSION:-v1.2.1}
        COMMIT: ${FORGEPANEL_COMMIT:-local}
        BUILD_DATE: ${FORGEPANEL_BUILD_DATE:-local}
    container_name: forgepanel
    restart: unless-stopped

    ports:
      - "2053:2053"     # panel UI
      - "2054:2054"     # REST API
      - "2096:2096"     # subscription endpoint
      # 80 and 443 are needed ONLY if you serve the panel on a domain with an
      # automatically issued certificate: 80 answers the ACME HTTP-01 challenge
      # and 443 serves the panel over HTTPS afterwards. Leave them commented for
      # a plain-HTTP panel on 2053, and do not publish them if something else on
      # the host already owns them.
      # - "80:80"
      # - "443:443"
      # ForgeDNS listens on 53/udp. Publish it only if you run the DNS tunnel
      # and nothing else on the host owns port 53 (on a systemd host that is
      # usually systemd-resolved — see docs/TROUBLESHOOTING.md).
      # - "53:53/udp"
      #
      # Proxy inbounds you create in the panel listen inside this container, so
      # each one needs its port published here too. Add them as you go, or use
      # `network_mode: host` if you would rather not maintain the list — at the
      # cost of the container sharing the host's network namespace.

    environment:
      FORGEPANEL_DATA: /var/lib/forgepanel
      #
      # If you put the panel behind a reverse proxy, list the proxy's addresses
      # so client IPs are read from X-Forwarded-For. Without this the panel
      # trusts no proxy, and every request appears to come from the proxy —
      # which would make the login rate limiter useless.
      # FORGEPANEL_TRUSTED_PROXIES: "172.16.0.0/12"

    volumes:
      - forgepanel-data:/var/lib/forgepanel

    # Probes HTTPS then HTTP on the configured port, so it survives switching
    # the panel to a domain + Let's Encrypt certificate.
    healthcheck:
      test: ["CMD", "/usr/local/bin/forgectl", "healthcheck"]
      interval: 30s
      timeout: 12s
      start_period: 10s
      retries: 3

    # The image already runs as a non-root user and carries
    # CAP_NET_BIND_SERVICE on the binary, which is what lets it bind 80/443/53
    # without being root. Nothing here needs privileged mode.
    #
    # NET_ADMIN is required ONLY by features that reprogram host networking:
    # hysteria2 port-hopping (nftables/iptables redirect rules) and some
    # ForgeDNS setups. Delete this block if you use neither — the panel runs
    # normally without it and those features report an error rather than
    # failing silently.
    cap_add:
      - NET_ADMIN

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  forgepanel-data:

# ---------------------------------------------------------------------------
# Reverse proxy
#
# Deliberately not included. Terminating TLS at Caddy/nginx/Traefik in front of
# the panel is a reasonable setup, but it is a different deployment from this
# one — the panel would stop managing its own certificate, port 80/443 would
# belong to the proxy, and FORGEPANEL_TRUSTED_PROXIES would become mandatory.
# Mixing both into one example produces a file where half the lines must be
# deleted. See docs/CONFIGURATION.md for the reverse-proxy variant.
# ---------------------------------------------------------------------------
