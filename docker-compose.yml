# ForgePanel — SQLite by default; `--profile postgres` for Postgres (spec §14).
services:
  forgepanel:
    build: .
    image: forgepanel:latest
    restart: unless-stopped
    ports:
      - "2053:2053"   # panel (HTTPS)
      - "2096:2096"   # subscription
      - "53:53/udp"   # ForgeDNS
    volumes:
      - forgepanel-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/forgectl", "keygen", "uuid"]
      interval: 30s
      timeout: 5s
      retries: 3
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
volumes:
  forgepanel-data:
