<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>ForgePanel — Config Studio</title>
<style>
/* ==========================================================================
   ForgePanel Config Studio — design tokens
   Everything is a CSS custom property so the light/dark toggle is one attribute
   flip on <html data-theme>. No external fonts, no external CSS: the whole page
   is embedded into the Go binary with go:embed and must work fully offline.
   ========================================================================== */
:root {
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --font-fa: "Vazirmatn", "IRANSansX", "IRANSans", "Segoe UI", Tahoma, system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Courier New", monospace;

  --r-sm: 8px;
  --r-md: 11px;
  --r-lg: 14px;
  --r-xl: 18px;

  --accent: #7c8cff;
  --accent-2: #26d5f0;
  --accent-3: #b672ff;
  --grad: linear-gradient(100deg, var(--accent) 0%, var(--accent-3) 45%, var(--accent-2) 100%);

  --ok: #37d399;
  --warn: #f5b544;
  --err: #ff6b7a;
  --info: #66aaff;

  --dur: 160ms;
  --ease: cubic-bezier(.22,.61,.36,1);
}

/* ---------- dark (default) ---------- */
html[data-theme="dark"] {
  --bg: #080a10;
  --bg-grid: rgba(255,255,255,.022);
  --panel: #11141d;
  --panel-2: #161a25;
  --panel-3: #1c2130;
  --input: #0d1017;
  --code-bg: #090b11;
  --border: #232939;
  --border-soft: #1a1f2c;
  --text: #e9edf7;
  --text-2: #b9c1d4;
  --muted: #8d96ad;
  --faint: #626b81;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.75);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
  --tint: rgba(124,140,255,.14);
  --tint-line: rgba(124,140,255,.45);
  --glow: 0 0 0 1px rgba(124,140,255,.35), 0 8px 26px -12px rgba(124,140,255,.65);
  --scroll: #2b3247;
}

/* ---------- light ---------- */
html[data-theme="light"] {
  --bg: #f4f6fb;
  --bg-grid: rgba(15,23,42,.025);
  --panel: #ffffff;
  --panel-2: #f7f9fd;
  --panel-3: #eef2f9;
  --input: #ffffff;
  --code-bg: #f8fafc;
  --border: #dde3ee;
  --border-soft: #e8edf5;
  --text: #101625;
  --text-2: #33405a;
  --muted: #5c6880;
  --faint: #808ba1;
  --shadow: 0 1px 2px rgba(16,22,37,.06), 0 14px 34px -18px rgba(16,22,37,.35);
  --shadow-sm: 0 1px 2px rgba(16,22,37,.07);
  --tint: rgba(89,105,241,.10);
  --tint-line: rgba(89,105,241,.40);
  --glow: 0 0 0 1px rgba(89,105,241,.30), 0 8px 24px -14px rgba(89,105,241,.6);
  --scroll: #c6cede;
  --accent: #5969f1;
  --accent-2: #0aa5c4;
  --accent-3: #9333ea;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(1200px 600px at 12% -8%, rgba(124,140,255,.10), transparent 60%),
    radial-gradient(900px 500px at 96% 0%, rgba(38,213,240,.07), transparent 55%),
    var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;             /* panes scroll individually on desktop */
}
html[dir="rtl"] body { font-family: var(--font-fa); }

/* Native-feeling scrollbars that respect the theme. */
* { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover { background: var(--faint); background-clip: content-box; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }

/* ==========================================================================
   Header
   ========================================================================== */
.hdr {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  height: 58px;
  padding-inline: 16px;
  border-bottom: 1px solid var(--border);
  background:
    linear-gradient(100deg, rgba(124,140,255,.16), rgba(182,114,255,.11) 42%, rgba(38,213,240,.09) 100%),
    var(--panel);
  backdrop-filter: blur(8px);
  z-index: 40;
}
.hdr::after {
  content: "";
  position: absolute; inset-inline: 0; bottom: -1px; height: 1px;
  background: var(--grad); opacity: .55;
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.logo {
  width: 30px; height: 30px; border-radius: 9px; flex: none;
  background: var(--grad);
  display: grid; place-items: center;
  color: #fff; font-weight: 800; font-size: 15px;
  box-shadow: 0 4px 14px -6px var(--accent);
}
.brand-txt { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand-txt b {
  font-size: 15px; font-weight: 700; letter-spacing: -.01em;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  white-space: nowrap;
}
.brand-txt span { font-size: 11px; color: var(--muted); white-space: nowrap; }
.hdr-spacer { flex: 1 1 auto; }
.hdr-tools { display: flex; align-items: center; gap: 8px; }

.kbd-hint {
  display: inline-flex; align-items: center; gap: 7px;
  height: 32px; padding-inline: 11px;
  border: 1px solid var(--border); border-radius: 99px;
  background: var(--panel-2); color: var(--muted); font-size: 12px;
  transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.kbd-hint:hover { color: var(--text-2); border-color: var(--tint-line); }
kbd {
  font-family: var(--font-mono); font-size: 10.5px; line-height: 1;
  padding: 3px 5px; border-radius: 5px;
  background: var(--panel-3); border: 1px solid var(--border);
  color: var(--text-2); white-space: nowrap;
}
.icon-btn {
  height: 32px; min-width: 32px; padding-inline: 9px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--border); border-radius: 9px;
  background: var(--panel-2); color: var(--text-2);
  font-size: 12px; font-weight: 600;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.icon-btn:hover { background: var(--panel-3); color: var(--text); border-color: var(--tint-line); }
.icon-btn:active { transform: translateY(1px); }
.seg {
  display: inline-flex; padding: 2px; gap: 2px;
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
}
.seg button {
  border: 0; background: transparent; color: var(--muted);
  font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 8px;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: var(--shadow-sm); }

/* ==========================================================================
   Three-pane layout
   ========================================================================== */
.studio {
  display: grid;
  grid-template-columns: 274px minmax(0,1fr) minmax(380px, 452px);
  gap: 13px;
  padding: 13px;
  height: calc(100vh - 58px);
  height: calc(100dvh - 58px);
  overflow: hidden;
}
.pane { min-width: 0; height: 100%; overflow-y: auto; overflow-x: hidden; padding-bottom: 40px; scroll-behavior: smooth; }
.pane--rail { display: flex; flex-direction: column; gap: 11px; }
.pane--form { display: flex; flex-direction: column; gap: 11px; }
.pane--preview { display: flex; flex-direction: column; }

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.card--flush { background: var(--panel); }
.card-h {
  display: flex; align-items: center; gap: 9px;
  padding: 11px 13px;
  border-bottom: 1px solid var(--border-soft);
  font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: var(--muted);
  background: linear-gradient(180deg, var(--panel-2), transparent);
}
.card-h .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--grad); flex: none; }
.card-h .h-right { margin-inline-start: auto; text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 11px; color: var(--faint); }
.card-b { padding: 12px 13px; }

/* ---------- search ---------- */
.search-wrap { position: relative; }
.search-wrap svg { position: absolute; inset-inline-start: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
#protoSearch {
  width: 100%; height: 38px;
  padding-inline: 34px 46px;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--input); color: var(--text);
  font-size: 13px;
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
#protoSearch::placeholder { color: var(--faint); }
#protoSearch:focus { outline: none; border-color: var(--tint-line); box-shadow: var(--glow); }
.search-kbd { position: absolute; inset-inline-end: 9px; top: 50%; transform: translateY(-50%); pointer-events: none; }

/* ---------- protocol list ---------- */
.proto-list { display: flex; flex-direction: column; gap: 4px; max-height: 46vh; overflow-y: auto; padding: 2px; }
.proto {
  display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 9px;
  width: 100%; text-align: start;
  padding: 7px 9px; border-radius: var(--r-md);
  border: 1px solid transparent; background: transparent; color: var(--text-2);
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.proto:hover { background: var(--panel-2); color: var(--text); }
.proto[aria-selected="true"] {
  background: var(--tint); border-color: var(--tint-line); color: var(--text);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
}
.proto .glyph {
  width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
  background: var(--panel-3); border: 1px solid var(--border-soft);
  font-size: 13px; font-weight: 800; letter-spacing: -.02em; color: var(--text-2);
}
.proto[aria-selected="true"] .glyph { background: var(--grad); color: #fff; border-color: transparent; }
.proto .pl { display: flex; flex-direction: column; min-width: 0; }
.proto .pl b { font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
.proto .pl small { font-size: 10.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proto .tick { color: var(--accent); opacity: 0; font-size: 12px; }
.proto[aria-selected="true"] .tick { opacity: 1; }
.empty-note { padding: 14px 4px; text-align: center; color: var(--faint); font-size: 12px; }

/* ---------- chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 5px 11px; border-radius: 99px;
  border: 1px solid var(--border); background: var(--panel-2); color: var(--text-2);
  font-size: 12px; font-weight: 600; letter-spacing: .01em;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.chip:hover:not(:disabled) { border-color: var(--tint-line); color: var(--text); }
.chip:active:not(:disabled) { transform: translateY(1px); }
.chip[aria-pressed="true"] { background: var(--tint); border-color: var(--tint-line); color: var(--text); }
.chip:disabled { opacity: .32; cursor: not-allowed; }
.chip .cdot { display: inline-block; width: 5px; height: 5px; border-radius: 99px; background: currentColor; margin-inline-end: 6px; opacity: .5; vertical-align: middle; }
.chip[aria-pressed="true"] .cdot { background: var(--accent); opacity: 1; }

/* ---------- presets ---------- */
.preset {
  display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center;
  width: 100%; text-align: start;
  padding: 8px 10px; margin-bottom: 4px;
  border: 1px solid var(--border-soft); border-radius: var(--r-md);
  background: var(--panel-2); color: var(--text-2);
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.preset:last-child { margin-bottom: 0; }
.preset:hover { border-color: var(--tint-line); background: var(--panel-3); color: var(--text); }
.preset:active { transform: translateY(1px); }
.preset b { display: block; font-size: 12.5px; font-weight: 600; }
.preset small { display: block; font-size: 10.5px; color: var(--faint); }
.preset .arrow { color: var(--faint); font-size: 12px; }
html[dir="rtl"] .preset .arrow { transform: scaleX(-1); }

/* ==========================================================================
   Form
   ========================================================================== */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 11px 12px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field > label { font-size: 11.5px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.field > label .req { color: var(--err); font-size: 13px; line-height: 1; }
.field .help { font-size: 10.5px; color: var(--faint); line-height: 1.45; }
.ctl-row { display: flex; gap: 6px; align-items: stretch; min-width: 0; }
.ctl-row > *:first-child { flex: 1 1 auto; min-width: 0; }

input[type="text"], input[type="number"], input[type="password"], select, textarea {
  width: 100%;
  min-height: 36px;
  padding: 8px 11px;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--input);
  color: var(--text);
  font-size: 13px;
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), background var(--dur) var(--ease);
}
textarea { min-height: 74px; resize: vertical; line-height: 1.5; }
input:hover:not(:disabled), select:hover, textarea:hover { border-color: var(--faint); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--tint-line); box-shadow: var(--glow); }
input::placeholder, textarea::placeholder { color: var(--faint); }
input.mono, textarea.mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: -.01em; }
input:invalid, input[aria-invalid="true"] { border-color: var(--err); }
select {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: right 14px center, right 9px center;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-inline-end: 28px;
}
html[dir="rtl"] select { background-position: left 9px center, left 14px center; padding-inline-end: 11px; padding-inline-start: 28px;
  background-image: linear-gradient(135deg, transparent 50%, var(--muted) 50%), linear-gradient(45deg, var(--muted) 50%, transparent 50%); }

/* LTR islands: URIs, keys, JSON must never be mirrored in Farsi mode. */
.ltr { direction: ltr !important; text-align: left !important; unicode-bidi: isolate; }

.gen {
  flex: none; display: inline-flex; align-items: center; gap: 5px;
  padding-inline: 10px; height: auto; min-height: 36px;
  border-radius: var(--r-md); border: 1px solid var(--tint-line);
  background: var(--tint); color: var(--text);
  font-size: 11.5px; font-weight: 700; white-space: nowrap;
  transition: filter var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.gen:hover { filter: brightness(1.18); }
.gen:active { transform: translateY(1px); }
.gen.busy { opacity: .6; pointer-events: none; }

/* switch */
.switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; padding: 6px 0; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch .track {
  width: 36px; height: 21px; border-radius: 99px; flex: none;
  background: var(--panel-3); border: 1px solid var(--border);
  position: relative; transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.switch .track::after {
  content: ""; position: absolute; top: 2px; inset-inline-start: 2px;
  width: 15px; height: 15px; border-radius: 99px; background: var(--muted);
  transition: transform var(--dur) var(--ease), background var(--dur) var(--ease);
}
.switch input:checked + .track { background: var(--tint); border-color: var(--tint-line); }
.switch input:checked + .track::after { background: var(--accent); transform: translateX(15px); }
html[dir="rtl"] .switch input:checked + .track::after { transform: translateX(-15px); }
.switch input:focus-visible + .track { box-shadow: var(--glow); }
.switch span.lbl { font-size: 12.5px; font-weight: 500; color: var(--text-2); }
.field > label.switch { font-size: 12.5px; color: var(--text-2); }

/* ==========================================================================
   Preview
   ========================================================================== */
.preview-card { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.pv-head {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  border-bottom: 1px solid var(--border-soft);
  background: linear-gradient(180deg, var(--panel-2), transparent);
}
.pv-title { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.live {
  display: inline-flex; align-items: center; gap: 6px; margin-inline-start: auto;
  font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums;
}
.live .pulse { width: 7px; height: 7px; border-radius: 99px; background: var(--ok); box-shadow: 0 0 0 0 rgba(55,211,153,.6); }
.live.busy .pulse { background: var(--accent); animation: pulse 1s var(--ease) infinite; }
.live.err .pulse { background: var(--err); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(124,140,255,.55); } 70% { box-shadow: 0 0 0 7px rgba(124,140,255,0); } 100% { box-shadow: 0 0 0 0 rgba(124,140,255,0); } }

.tabs { display: flex; gap: 2px; padding: 8px 8px 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative; border: 0; background: transparent; color: var(--muted);
  font-size: 12.5px; font-weight: 600; padding: 7px 11px 9px; border-radius: var(--r-sm) var(--r-sm) 0 0;
  white-space: nowrap; transition: color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.tab:hover { color: var(--text-2); background: var(--panel-2); }
.tab[aria-selected="true"] { color: var(--text); }
.tab[aria-selected="true"]::after {
  content: ""; position: absolute; inset-inline: 8px; bottom: 0; height: 2px; border-radius: 2px; background: var(--grad);
}
.tabs-rule { height: 1px; background: var(--border-soft); }

.pv-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.tabpanel { flex: 1 1 auto; min-height: 0; display: none; flex-direction: column; }
.tabpanel[data-active="true"] { display: flex; }

.code {
  flex: 1 1 auto; min-height: 0; margin: 0; overflow: auto;
  padding: 13px 14px;
  background: var(--code-bg);
  font-family: var(--font-mono); font-size: 12px; line-height: 1.6;
  color: var(--text-2); white-space: pre; tab-size: 2;
}
.code.wrap { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-all; }
.code .k { color: var(--accent); }
.code .s { color: var(--ok); }
.code .n { color: var(--accent-3); }
.code .b { color: var(--warn); }
.code .p { color: var(--faint); }
.code em { color: var(--faint); font-style: normal; }

.pv-actions {
  display: flex; gap: 6px; padding: 9px 11px; border-top: 1px solid var(--border-soft);
  background: var(--panel); flex-wrap: wrap; align-items: center;
}
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 11px; border-radius: var(--r-md);
  border: 1px solid var(--border); background: var(--panel-2); color: var(--text-2);
  font-size: 12px; font-weight: 600;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.btn:hover { background: var(--panel-3); color: var(--text); border-color: var(--tint-line); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--grad); border-color: transparent; color: #fff; box-shadow: 0 6px 18px -10px var(--accent); }
.btn.primary:hover { filter: brightness(1.08); color: #fff; }
.btn .ic { font-size: 12px; line-height: 1; }
.spacer { flex: 1 1 auto; }

/* QR */
.qr-wrap { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 18px 14px; overflow: auto; }
.qr-frame {
  padding: 14px; border-radius: var(--r-lg); background: #fff;
  box-shadow: 0 10px 32px -16px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.06);
  line-height: 0;
}
#qrCanvas { display: block; width: 236px; height: 236px; image-rendering: pixelated; }
.qr-meta { text-align: center; font-size: 11px; color: var(--faint); max-width: 300px; }
.qr-meta code { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }

/* findings */
.findings { border-top: 1px solid var(--border-soft); max-height: 152px; overflow: auto; background: var(--panel); }
.finding { display: flex; gap: 8px; padding: 8px 12px; font-size: 12px; border-bottom: 1px solid var(--border-soft); align-items: flex-start; }
.finding:last-child { border-bottom: 0; }
.finding .sev { flex: none; margin-top: 5px; width: 7px; height: 7px; border-radius: 99px; background: var(--muted); }
.finding.error .sev { background: var(--err); }
.finding.warn .sev  { background: var(--warn); }
.finding.info .sev  { background: var(--info); }
.finding .msg { color: var(--text-2); line-height: 1.45; }
.finding.error .msg { color: var(--text); }
.findings-empty { padding: 9px 12px; font-size: 11.5px; color: var(--faint); display: flex; align-items: center; gap: 7px; }

/* toast */
.toasts {
  position: fixed; inset-block-end: 18px; inset-inline: 0;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  pointer-events: none; z-index: 200; padding-inline: 12px;
}
.toast {
  display: flex; align-items: center; gap: 9px;
  max-width: min(92vw, 460px);
  padding: 9px 14px; border-radius: 99px;
  background: var(--panel); border: 1px solid var(--border);
  color: var(--text); font-size: 12.5px; box-shadow: var(--shadow);
  animation: toast-in 220ms var(--ease);
}
.toast .tdot { width: 7px; height: 7px; border-radius: 99px; background: var(--ok); flex: none; }
.toast.err .tdot { background: var(--err); }
.toast.warn .tdot { background: var(--warn); }
.toast.out { animation: toast-out 200ms var(--ease) forwards; }
@keyframes toast-in { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(6px) scale(.98); } }

/* mobile pane switcher */
.mobile-nav { display: none; }

/* ==========================================================================
   Responsive — 3 panes -> 2 -> 1, usable down to 375px
   ========================================================================== */
@media (max-width: 1180px) {
  .studio { grid-template-columns: 250px minmax(0,1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 42vh); }
  .pane--rail { grid-row: 1 / span 2; }
  .pane--preview { grid-column: 2; grid-row: 2; }
}
@media (max-width: 860px) {
  body { overflow: auto; }
  .studio {
    display: block; height: auto; padding: 11px 11px 84px;
  }
  .pane { height: auto; overflow: visible; padding-bottom: 0; }
  .pane + .pane { margin-top: 11px; }
  .pane[hidden] { display: none; }
  .preview-card { height: auto; }
  .code { max-height: 44vh; }
  .proto-list { max-height: none; }
  .mobile-nav {
    display: flex; gap: 6px;
    position: fixed; inset-block-end: 0; inset-inline: 0; z-index: 60;
    padding: 9px 11px calc(9px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(12px);
  }
  .mobile-nav button {
    flex: 1 1 0; padding: 10px 8px; border-radius: var(--r-md);
    border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
    font-size: 12.5px; font-weight: 700;
  }
  .mobile-nav button[aria-pressed="true"] { background: var(--tint); border-color: var(--tint-line); color: var(--text); }
  .toasts { inset-block-end: 76px; }
}
@media (max-width: 560px) {
  .form-grid { grid-template-columns: minmax(0,1fr); }
  .hdr { height: 54px; padding-inline: 11px; gap: 9px; }
  .brand-txt span { display: none; }
  .kbd-hint { display: none; }
  #qrCanvas { width: 200px; height: 200px; }
}
@media (max-width: 390px) {
  .hdr-tools .seg button { padding: 4px 7px; }
  .card-b { padding: 11px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
@media print {
  .hdr, .pane--rail, .pane--form, .pv-actions, .mobile-nav, .tabs { display: none !important; }
  body { overflow: visible; background: #fff; }
}
</style>

<body>
<!-- ======================================================================
     Header
     ====================================================================== -->
<header class="hdr">
  <div class="brand">
    <div class="logo" aria-hidden="true">F</div>
    <div class="brand-txt">
      <b data-i18n="appTitle">ForgePanel — Config Studio</b>
      <span data-i18n="appSub">Visual builder · live preview · 14 protocols</span>
    </div>
  </div>

  <div class="hdr-spacer"></div>

  <div class="hdr-tools">
    <button class="kbd-hint" id="paletteHint" type="button" title="Focus protocol search">
      <span data-i18n="search">Search protocols</span>
      <kbd id="kbdKey">⌘K</kbd>
    </button>

    <div class="seg" role="group" aria-label="Language">
      <button type="button" id="langEn" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" id="langFa" data-lang="fa" aria-pressed="false">فا</button>
    </div>

    <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme" title="Toggle theme">
      <span id="themeIcon" aria-hidden="true">◐</span>
      <span id="themeLabel" data-i18n="dark">Dark</span>
    </button>
  </div>
</header>

<!-- ======================================================================
     Three-pane studio: pickers | form | live preview
     ====================================================================== -->
<main class="studio">

  <!-- ---------------- LEFT: pickers ---------------- -->
  <section class="pane pane--rail" id="paneRail" aria-label="Pickers">

    <div class="card">
      <div class="card-b">
        <div class="search-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path>
          </svg>
          <input id="protoSearch" type="text" autocomplete="off" spellcheck="false"
                 placeholder="Search protocols…" aria-label="Search protocols"
                 role="combobox" aria-expanded="true" aria-controls="protoList">
          <kbd class="search-kbd" id="kbdKey2">⌘K</kbd>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><span class="dot"></span><span data-i18n="protocol">Protocol</span>
        <span class="h-right" id="protoCount">14</span>
      </div>
      <div class="card-b" style="padding:6px">
        <div class="proto-list" id="protoList" role="listbox" aria-label="Protocol"></div>
      </div>
    </div>

    <div class="card" id="transportCard">
      <div class="card-h"><span class="dot"></span><span data-i18n="transport">Transport</span></div>
      <div class="card-b"><div class="chips" id="transportChips" role="group" aria-label="Transport"></div></div>
    </div>

    <div class="card" id="securityCard">
      <div class="card-h"><span class="dot"></span><span data-i18n="security">Security</span></div>
      <div class="card-b"><div class="chips" id="securityChips" role="group" aria-label="Security"></div></div>
    </div>

    <div class="card">
      <div class="card-h"><span class="dot"></span><span data-i18n="presets">Quick presets</span></div>
      <div class="card-b" style="padding:8px"><div id="presetList"></div></div>
    </div>

  </section>

  <!-- ---------------- CENTER: form ---------------- -->
  <section class="pane pane--form" id="paneForm" aria-label="Configuration form">
    <div id="formSections"></div>
  </section>

  <!-- ---------------- RIGHT: live preview ---------------- -->
  <section class="pane pane--preview" id="panePreview" aria-label="Live preview">
    <div class="card preview-card">

      <div class="pv-head">
        <span class="pv-title" data-i18n="livePreview">Live preview</span>
        <span class="live" id="liveBadge" aria-live="polite">
          <span class="pulse"></span><span id="liveText">idle</span>
        </span>
      </div>

      <div class="tabs" role="tablist" aria-label="Preview format" id="tabBar">
        <button class="tab" role="tab" data-tab="uri"     aria-selected="true"  id="tab-uri"     aria-controls="panel-uri"     tabindex="0" data-i18n="tabUri">Client URI</button>
        <button class="tab" role="tab" data-tab="qr"      aria-selected="false" id="tab-qr"      aria-controls="panel-qr"      tabindex="-1" data-i18n="tabQr">QR</button>
        <button class="tab" role="tab" data-tab="xray"    aria-selected="false" id="tab-xray"    aria-controls="panel-xray"    tabindex="-1" data-i18n="tabXray">Xray</button>
        <button class="tab" role="tab" data-tab="singbox" aria-selected="false" id="tab-singbox" aria-controls="panel-singbox" tabindex="-1" data-i18n="tabSingbox">sing-box</button>
        <button class="tab" role="tab" data-tab="clash"   aria-selected="false" id="tab-clash"   aria-controls="panel-clash"   tabindex="-1" data-i18n="tabClash">Clash</button>
      </div>
      <div class="tabs-rule"></div>

      <div class="pv-body">
        <div class="tabpanel" id="panel-uri" role="tabpanel" aria-labelledby="tab-uri" data-active="true">
          <pre class="code wrap ltr" id="outUri" dir="ltr"></pre>
        </div>
        <div class="tabpanel" id="panel-qr" role="tabpanel" aria-labelledby="tab-qr">
          <div class="qr-wrap">
            <div class="qr-frame"><canvas id="qrCanvas" width="236" height="236" role="img" aria-label="Configuration QR code"></canvas></div>
            <div class="qr-meta" id="qrMeta"></div>
          </div>
        </div>
        <div class="tabpanel" id="panel-xray" role="tabpanel" aria-labelledby="tab-xray">
          <pre class="code ltr" id="outXray" dir="ltr"></pre>
        </div>
        <div class="tabpanel" id="panel-singbox" role="tabpanel" aria-labelledby="tab-singbox">
          <pre class="code ltr" id="outSingbox" dir="ltr"></pre>
        </div>
        <div class="tabpanel" id="panel-clash" role="tabpanel" aria-labelledby="tab-clash">
          <pre class="code ltr" id="outClash" dir="ltr"></pre>
        </div>
      </div>

      <div class="findings" id="findings"></div>

      <div class="pv-actions">
        <button class="btn primary" id="copyBtn" type="button">
          <span class="ic" aria-hidden="true">⧉</span><span data-i18n="copy">Copy</span>
        </button>
        <button class="btn" id="downloadBtn" type="button">
          <span class="ic" aria-hidden="true">↓</span><span data-i18n="download">Download</span>
        </button>
        <span class="spacer"></span>
        <button class="btn" id="jsonBtn" type="button" title="Copy the canonical node JSON">
          <span class="ic" aria-hidden="true">{}</span><span data-i18n="canonical">Canonical</span>
        </button>
        <button class="btn" id="resetBtn" type="button">
          <span class="ic" aria-hidden="true">⟲</span><span data-i18n="reset">Reset</span>
        </button>
      </div>

    </div>
  </section>
</main>

</nav>

<script>
/* ===========================================================================
 * qr.js — tiny, dependency-free QR Code encoder (byte mode, versions 1..40).
 *
 * A condensed re-implementation of the QR Code Model 2 encoding pipeline as
 * described by ISO/IEC 18004, following the structure of Project Nayuki's
 * reference generator.  Kept deliberately small so the whole Config Studio
 * stays a single embeddable file with zero network dependencies.
 *
 * MIT License — do what you want, keep the notice.
 *
 *   QR.encode(text[, ecl])  ->  { size, modules[y][x], version, ecl, mask }
 *                               or null when the text does not fit / is empty
 * ======================================================================== */
var QR = (function () {
  'use strict';

  /* Error-correction codewords per block, indexed [ecl][version 1..40].
     Only the L and M levels are shipped: M is used by default and L is the
     fallback for payloads too large for M (long VMess links, WireGuard keys). */
  var ECC_CW = {
    L: [-1, 7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    M: [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28]
  };
  /* Number of error-correction blocks, indexed [ecl][version 1..40]. */
  var ECC_BLOCKS = {
    L: [-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
    M: [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49]
  };
  /* 2-bit format value for each EC level (not the same order as the names). */
  var FORMAT_BITS = { L: 1, M: 0 };

  /* ---- capacity maths ---------------------------------------------------- */

  // Total number of data+EC modules available in a version (before function
  // patterns and format/version information are subtracted).
  function rawDataModules(ver) {
    var r = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      var n = Math.floor(ver / 7) + 2;           // alignment patterns per side
      r -= (25 * n - 10) * n - 55;
      if (ver >= 7) r -= 36;                     // two version-info blocks
    }
    return r;
  }

  function dataCodewords(ver, ecl) {
    return Math.floor(rawDataModules(ver) / 8) - ECC_CW[ecl][ver] * ECC_BLOCKS[ecl][ver];
  }

  /* ---- GF(2^8) arithmetic, primitive polynomial 0x11D --------------------- */

  function gmul(x, y) {
    var z = 0;
    for (var i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11D);
      z ^= ((y >>> i) & 1) * x;
    }
    return z & 0xFF;
  }

  // Reed-Solomon generator polynomial of the given degree (monic, x^d + ...).
  function rsDivisor(degree) {
    var res = [], i, j;
    for (i = 0; i < degree; i++) res.push(0);
    res[degree - 1] = 1;
    var root = 1;
    for (i = 0; i < degree; i++) {
      for (j = 0; j < degree; j++) {
        res[j] = gmul(res[j], root);
        if (j + 1 < degree) res[j] ^= res[j + 1];
      }
      root = gmul(root, 2);
    }
    return res;
  }

  function rsRemainder(data, div) {
    var res = [], i, j;
    for (i = 0; i < div.length; i++) res.push(0);
    for (i = 0; i < data.length; i++) {
      var factor = data[i] ^ res.shift();
      res.push(0);
      for (j = 0; j < div.length; j++) res[j] ^= gmul(div[j], factor);
    }
    return res;
  }

  /* ---- bit stream -------------------------------------------------------- */

  // UTF-8 encode without TextEncoder so the file works in any browser context.
  function utf8Bytes(str) {
    var out = [], esc = encodeURIComponent(str);
    for (var i = 0; i < esc.length; i++) {
      if (esc.charAt(i) === '%') { out.push(parseInt(esc.substr(i + 1, 2), 16)); i += 2; }
      else out.push(esc.charCodeAt(i));
    }
    return out;
  }

  function pickVersion(len, ecl) {
    for (var ver = 1; ver <= 40; ver++) {
      var need = 4 + (ver < 10 ? 8 : 16) + len * 8;
      if (need <= dataCodewords(ver, ecl) * 8) return ver;
    }
    return -1;
  }

  // Mode indicator + character count + payload + terminator + pad bytes.
  function makeCodewords(bytes, ver, ecl) {
    var bits = [], i, j;
    function push(val, n) { for (var k = n - 1; k >= 0; k--) bits.push((val >>> k) & 1); }
    push(4, 4);                                   // 0100 = byte mode
    push(bytes.length, ver < 10 ? 8 : 16);
    for (i = 0; i < bytes.length; i++) push(bytes[i], 8);

    var cap = dataCodewords(ver, ecl) * 8;
    push(0, Math.min(4, cap - bits.length));      // terminator
    push(0, (8 - bits.length % 8) % 8);           // pad to byte boundary
    for (var pad = 0xEC; bits.length < cap; pad ^= 0xEC ^ 0x11) push(pad, 8);

    var cw = [];
    for (i = 0; i < bits.length; i += 8) {
      var b = 0;
      for (j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
      cw.push(b);
    }
    return cw;
  }

  // Split into blocks, append RS codewords, then interleave as the spec wants.
  function addEcc(data, ver, ecl) {
    var numBlocks = ECC_BLOCKS[ecl][ver];
    var eccLen = ECC_CW[ecl][ver];
    var rawCw = Math.floor(rawDataModules(ver) / 8);
    var shortBlocks = numBlocks - rawCw % numBlocks;
    var shortLen = Math.floor(rawCw / numBlocks);
    var div = rsDivisor(eccLen);
    var blocks = [], i, j, k = 0;

    for (i = 0; i < numBlocks; i++) {
      var take = shortLen - eccLen + (i < shortBlocks ? 0 : 1);
      var dat = data.slice(k, k + take);
      k += take;
      var ecc = rsRemainder(dat, div);
      if (i < shortBlocks) dat.push(0);           // placeholder, skipped below
      blocks.push(dat.concat(ecc));
    }

    var out = [];
    for (i = 0; i < blocks[0].length; i++) {
      for (j = 0; j < blocks.length; j++) {
        if (i !== shortLen - eccLen || j >= shortBlocks) out.push(blocks[j][i]);
      }
    }
    return out;
  }

  /* ---- matrix ------------------------------------------------------------ */

  function alignmentPositions(ver) {
    if (ver === 1) return [];
    var n = Math.floor(ver / 7) + 2;
    var step = (ver === 32) ? 26 : Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2;
    var res = [6];
    for (var pos = ver * 4 + 10; res.length < n; pos -= step) res.splice(1, 0, pos);
    return res;
  }

  function build(ver, ecl, codewords) {
    var size = ver * 4 + 17;
    var mod = [], fn = [], x, y, i, j;
    for (y = 0; y < size; y++) {
      mod.push(new Array(size).fill(false));
      fn.push(new Array(size).fill(false));
    }
    function setFn(px, py, dark) {
      if (px < 0 || py < 0 || px >= size || py >= size) return;
      mod[py][px] = dark; fn[py][px] = true;
    }
    function bit(v, k) { return ((v >>> k) & 1) !== 0; }

    // Finder patterns (+ their separators, drawn as light modules).
    function finder(cx, cy) {
      for (var dy = -4; dy <= 4; dy++) {
        for (var dx = -4; dx <= 4; dx++) {
          var d = Math.max(Math.abs(dx), Math.abs(dy));
          setFn(cx + dx, cy + dy, d !== 2 && d !== 4);
        }
      }
    }
    // Timing patterns.
    for (i = 0; i < size; i++) { setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);

    // Alignment patterns, skipping the three that collide with the finders.
    var ap = alignmentPositions(ver);
    for (i = 0; i < ap.length; i++) {
      for (j = 0; j < ap.length; j++) {
        if ((i === 0 && j === 0) || (i === 0 && j === ap.length - 1) || (i === ap.length - 1 && j === 0)) continue;
        for (var ay = -2; ay <= 2; ay++) {
          for (var ax = -2; ax <= 2; ax++) {
            setFn(ap[j] + ax, ap[i] + ay, Math.max(Math.abs(ax), Math.abs(ay)) !== 1);
          }
        }
      }
    }

    // Format information (BCH 15,5 with mask 0x5412), written twice.
    function drawFormat(mask) {
      var data = (FORMAT_BITS[ecl] << 3) | mask, rem = data, k;
      for (k = 0; k < 10; k++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      var bits = ((data << 10) | rem) ^ 0x5412;
      for (k = 0; k <= 5; k++) setFn(8, k, bit(bits, k));
      setFn(8, 7, bit(bits, 6));
      setFn(8, 8, bit(bits, 7));
      setFn(7, 8, bit(bits, 8));
      for (k = 9; k < 15; k++) setFn(14 - k, 8, bit(bits, k));
      for (k = 0; k < 8; k++) setFn(size - 1 - k, 8, bit(bits, k));
      for (k = 8; k < 15; k++) setFn(8, size - 15 + k, bit(bits, k));
      setFn(8, size - 8, true);                  // always-dark module
    }

    // Version information (BCH 18,6), versions 7 and up only.
    if (ver >= 7) {
      var rem = ver;
      for (i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      var vbits = (ver << 12) | rem;
      for (i = 0; i < 18; i++) {
        var vb = bit(vbits, i), a = size - 11 + i % 3, b = Math.floor(i / 3);
        setFn(a, b, vb); setFn(b, a, vb);
      }
    }
    drawFormat(0);                               // placeholder, redrawn later

    // Zig-zag placement of the interleaved codewords.
    var idx = 0;
    for (var right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;                // skip the vertical timing line
      for (var vert = 0; vert < size; vert++) {
        for (j = 0; j < 2; j++) {
          x = right - j;
          var upward = ((right + 1) & 2) === 0;
          y = upward ? size - 1 - vert : vert;
          if (!fn[y][x] && idx < codewords.length * 8) {
            mod[y][x] = bit(codewords[idx >>> 3], 7 - (idx & 7));
            idx++;
          }
        }
      }
    }

    function maskFn(m, mx, my) {
      switch (m) {
        case 0: return (mx + my) % 2 === 0;
        case 1: return my % 2 === 0;
        case 2: return mx % 3 === 0;
        case 3: return (mx + my) % 3 === 0;
        case 4: return (Math.floor(mx / 3) + Math.floor(my / 2)) % 2 === 0;
        case 5: return (mx * my) % 2 + (mx * my) % 3 === 0;
        case 6: return ((mx * my) % 2 + (mx * my) % 3) % 2 === 0;
        default: return ((mx + my) % 2 + (mx * my) % 3) % 2 === 0;
      }
    }
    function applyMask(m) {
      for (var my = 0; my < size; my++) {
        for (var mx = 0; mx < size; mx++) {
          if (!fn[my][mx] && maskFn(m, mx, my)) mod[my][mx] = !mod[my][mx];
        }
      }
    }

    // The four standard penalty rules; lower is better.
    function penalty() {
      var p = 0, dark = 0, rx, ry, run, rowStr, colStr;
      var FIND1 = '10111010000', FIND2 = '00001011101';
      for (ry = 0; ry < size; ry++) {
        rowStr = ''; colStr = '';
        var runR = 1, runC = 1;
        for (rx = 0; rx < size; rx++) {
          rowStr += mod[ry][rx] ? '1' : '0';
          colStr += mod[rx][ry] ? '1' : '0';

  function renderProtocols() {
    var list = $('#protoList');
    var q = state.filter.trim().toLowerCase();
    list.innerHTML = '';
    var shown = CATALOG.filter(function (c) {
      if (!q) return true;
      return (c.proto + ' ' + c.label + ' ' + (c.hint || '')).toLowerCase().indexOf(q) !== -1;
    });
    $('#protoCount').textContent = shown.length + (q ? '/' + CATALOG.length : '');

    if (!shown.length) {
      list.appendChild(h('div', { class: 'empty-note', text: '—' }));
      return;
    }
    shown.forEach(function (c) {
      var selected = c.proto === state.node.protocol;
      var btn = h('button', {
        class: 'proto', type: 'button', role: 'option', 'data-proto': c.proto,
        'aria-selected': selected ? 'true' : 'false', tabindex: selected ? '0' : '-1',
        onclick: function () { if (c.proto !== state.node.protocol) switchProtocol(c.proto); }
      }, [
        h('span', { class: 'glyph', text: c.glyph || c.label.slice(0, 2).toUpperCase(), 'aria-hidden': 'true' }),
        h('span', { class: 'pl' }, [
          h('b', { text: c.label }),
          h('small', { text: c.hint || c.proto })
        ]),
        h('span', { class: 'tick', text: '✓', 'aria-hidden': 'true' })
      ]);
      list.appendChild(btn);
    });
  }

  function renderChips() {
    var cat = catalogFor(state.node.protocol);

    // Transport chips (hidden entirely when the protocol owns its wire format).
    var tWrap = $('#transportChips');
    tWrap.innerHTML = '';
    if (!cat.transports.length) {
      tWrap.appendChild(h('div', { class: 'help', style: 'font-size:11.5px;color:var(--faint)', text: t('fixed') }));
    } else {
      cat.transports.forEach(function (net) {
        var on = (state.node.transport.network || 'tcp') === net;
        tWrap.appendChild(h('button', {
          class: 'chip', type: 'button', 'aria-pressed': on ? 'true' : 'false',
          html: '<span class="cdot"></span>' + esc(net),
          onclick: function () {
            state.node.transport = { network: net };
            if (net !== 'tcp' && state.node.protocol === 'vless') state.node.flow = '';
            renderAll(); schedulePreview(0);
          }
        }));
      });
    }

    // Security chips.
    var sWrap = $('#securityChips');
    sWrap.innerHTML = '';
    ['none', 'tls', 'reality'].forEach(function (sec) {
      var allowed = cat.securities.indexOf(sec) !== -1;
      var on = state.node.security.type === sec;
      sWrap.appendChild(h('button', {
        class: 'chip', type: 'button', disabled: !allowed,
        'aria-pressed': on ? 'true' : 'false',
        title: allowed ? '' : t('notransport'),
        html: '<span class="cdot"></span>' + esc(sec === 'reality' ? 'REALITY' : sec.toUpperCase()),
        onclick: function () {
          if (!allowed || on) return;
          var host = state.node.security.server_name || state.node.address;
          if (sec === 'none') state.node.security = { type: 'none' };
          else if (sec === 'tls') state.node.security = { type: 'tls', server_name: host, fingerprint: 'chrome' };
          else state.node.security = {
            type: 'reality', fingerprint: 'chrome',
            reality: { dest: 'www.cloudflare.com:443', server_names: ['www.cloudflare.com'], spider_x: '/' }
          };
          renderAll(); schedulePreview(0);
        }
      }));
    });
  }

  function renderPresets() {
    var wrap = $('#presetList');
    wrap.innerHTML = '';
    PRESETS.forEach(function (p) {
      wrap.appendChild(h('button', {
        class: 'preset', type: 'button', onclick: function () { applyPreset(p); }
      }, [
        h('span', {}, [h('b', { text: p.name }), h('small', { text: p.desc })]),
        h('span', { class: 'arrow', text: '›', 'aria-hidden': 'true' })
      ]));
    });
  }

  function applyPreset(p) {
    var addr = state.node.address, tag = state.node.tag;
    var n = defaultNode(p.proto);
    n.address = addr; n.tag = tag;
    n.remark = 'ForgePanel ' + p.name;
    p.patch(n);
    state.node = n;
    renderAll();
    schedulePreview(0);
    toast(t('presetApplied') + ' · ' + p.name);
    // Fill in the credentials the preset needs, quietly.
    (p.keys || []).forEach(function (k) {
      if (k === 'uuid') runGen({ kind: 'uuid' }, 'uuid', true);
      else if (k === 'password') runGen({ kind: 'password' }, 'password', true);
      else if (k === 'ss2022') runGen({ kind: 'ss2022', method: n.method }, 'password', true);
      else if (k === 'hy2obfs') runGen({ kind: 'password' }, 'hysteria2.obfs_password', true);
      else if (k === 'dnskey') runGen({ kind: 'password' }, 'forgedns.key', true);
      else if (k === 'reality') runGen({ kind: 'reality', map: { private_key: 'security.reality.private_key', public_key: 'security.reality.public_key' } }, null, true);
      else if (k === 'shortid') runGen({ kind: 'shortid', map: { short_id: 'security.reality.short_id' }, also: 'security.reality.short_ids' }, null, true);
    });
  }

  /* =========================================================================
   * 8. Rendering — centre form
   * ====================================================================== */

  function renderForm(keepFocusId) {
    var host = $('#formSections');
    var focusId = keepFocusId || (document.activeElement && document.activeElement.getAttribute
      ? document.activeElement.getAttribute('data-fid') : null);
    var selStart = null, selEnd = null;
    if (focusId && document.activeElement && document.activeElement.setSelectionRange) {
      try { selStart = document.activeElement.selectionStart; selEnd = document.activeElement.selectionEnd; } catch (e) { /* type has no selection */ }
    }
    host.innerHTML = '';

    SECTIONS.forEach(function (sec) {
      var fields = FIELDS.filter(function (f) {
        return f.sec === sec.id && (!f.when || f.when(state.node));
      });
      if (!fields.length) return;

      var grid = h('div', { class: 'form-grid' });
      fields.forEach(function (f, i) { grid.appendChild(buildField(f, sec.id + '-' + i)); });

      var card = h('div', { class: 'card' }, [
        h('div', { class: 'card-h' }, [
          h('span', { class: 'dot' }),
          h('span', { text: fl(sec.title) }),
          h('span', { class: 'h-right', text: sec.id === 'endpoint' ? catalogFor(state.node.protocol).label : '' })
        ]),
        h('div', { class: 'card-b' }, [grid])
      ]);
      host.appendChild(card);
      host.appendChild(h('div', { style: 'height:11px' }));
    });

    if (focusId) {
      var again = $('[data-fid="' + focusId + '"]');
      if (again) {
        again.focus();
        if (selStart !== null && again.setSelectionRange) {
          try { again.setSelectionRange(selStart, selEnd); } catch (e) { /* non-text input */ }
        }
      }
    }
  }

  /* Build one labelled control from a schema entry. */
  function buildField(f, uid) {
    var fid = f.path + '::' + f.type;
    var val = getPath(state.node, f.path);
    var wrap = h('div', { class: 'field' + (f.wide ? ' wide' : '') });

    /* --- switch renders its own inline label --- */
    if (f.type === 'switch') {
      var input = h('input', { type: 'checkbox', 'data-fid': fid, id: 'fld-' + uid });
      input.checked = !!val;
      input.addEventListener('change', function () {
        setPath(state.node, f.path, input.checked);
        if (f.rerender) renderForm(fid);
        schedulePreview();
      });
      wrap.appendChild(h('label', { class: 'switch', for: 'fld-' + uid }, [
        input, h('span', { class: 'track' }), h('span', { class: 'lbl', text: fl(f.label) })
      ]));
      if (f.help) wrap.appendChild(h('div', { class: 'help', text: f.help }));
      return wrap;
    }

    var label = h('label', { for: 'fld-' + uid, text: fl(f.label) });
    if (f.req) label.appendChild(h('span', { class: 'req', text: '*', title: 'required', 'aria-hidden': 'true' }));
    wrap.appendChild(label);

    var ctl;
    if (f.type === 'select') {
      ctl = h('select', { id: 'fld-' + uid, 'data-fid': fid });
      (f.opts || []).forEach(function (o) {
        var v = (o && typeof o === 'object') ? o.v : o;
        var l = (o && typeof o === 'object') ? o.l : (o === '' ? 'none' : o);
        var opt = h('option', { value: String(v), text: l });
        if (String(v) === String(val === undefined || val === null ? '' : val)) opt.selected = true;
        ctl.appendChild(opt);
      });
      ctl.addEventListener('change', function () {
        var v = ctl.value;
        setPath(state.node, f.path, f.num ? Number(v) : v);
        if (f.rerender) renderForm();
        schedulePreview(0);
      });
    } else if (f.type === 'textarea' || f.type === 'headers' || f.type === 'lines') {
      ctl = h('textarea', {
        id: 'fld-' + uid, 'data-fid': fid, spellcheck: 'false', dir: 'ltr',
        class: (f.mono ? 'mono ltr' : 'ltr'), placeholder: f.ph || ''
      });
      ctl.value = f.type === 'headers' ? formatHeaders(val)
        : f.type === 'lines' ? (Array.isArray(val) ? val.join('\n') : (val || ''))
        : (val || '');
      ctl.addEventListener('input', function () {
        if (f.type === 'headers') setPath(state.node, f.path, parseHeaders(ctl.value));
        else if (f.type === 'lines') setPath(state.node, f.path, ctl.value.split(/\r?\n/).map(function (x) { return x.trim(); }).filter(Boolean));
        else setPath(state.node, f.path, ctl.value);
        schedulePreview();
      });
    } else {
      var isNum = f.type === 'number';
      ctl = h('input', {
        id: 'fld-' + uid, 'data-fid': fid, type: isNum ? 'number' : 'text',
        autocomplete: 'off', spellcheck: 'false', dir: 'ltr',
        class: (f.mono ? 'mono ltr' : 'ltr'), placeholder: f.ph || '',
        min: f.min, max: f.max
      });
      ctl.value = (f.type === 'list' || f.type === 'ints') ? joinList(val) : (val === undefined || val === null ? '' : val);
      ctl.addEventListener('input', function () {
        var raw = ctl.value;
        if (f.type === 'list') setPath(state.node, f.path, splitList(raw));
        else if (f.type === 'ints') setPath(state.node, f.path, splitList(raw).map(Number).filter(function (x) { return !isNaN(x); }));
        else if (isNum) setPath(state.node, f.path, raw === '' ? 0 : Number(raw));
        else setPath(state.node, f.path, raw);
        schedulePreview();
      });
    }

    // Attach a "Generate" button where the server can mint the value for us.
    if (f.gen) {
      var row = h('div', { class: 'ctl-row' }, [ctl]);
      var btn = h('button', {
        class: 'gen', type: 'button', title: 'Ask the server for a fresh value',
        html: '<span aria-hidden="true">⚡</span>' + esc(t('generate'))
      });
      btn.addEventListener('click', function () {
        var spec = typeof f.gen === 'function' ? f.gen(state.node) : f.gen;
        btn.classList.add('busy');
        runGen(spec, spec.map ? null : f.path, false).then(function () { btn.classList.remove('busy'); });
      });
      row.appendChild(btn);
      wrap.appendChild(row);
    } else {
      wrap.appendChild(ctl);
    }

    if (f.help) wrap.appendChild(h('div', { class: 'help', text: f.help }));
    return wrap;
  }

  /* =========================================================================
   * 9. Key generation — POST /api/keygen (with a safe in-browser fallback)
   * ====================================================================== */

  // Response shapes vary per kind; find the value under any plausible name.
  function pick(obj, names) {
    if (!obj || typeof obj !== 'object') return undefined;
    for (var i = 0; i < names.length; i++) {
      var n = names[i];
      var camel = n.replace(/_([a-z])/g, function (_, c) { return c.toUpperCase(); });
      if (typeof obj[n] === 'string' && obj[n]) return obj[n];
      if (typeof obj[camel] === 'string' && obj[camel]) return obj[camel];
    }
    var keys = Object.keys(obj);
    for (var j = 0; j < keys.length; j++) if (typeof obj[keys[j]] === 'string' && obj[keys[j]]) return obj[keys[j]];
    return undefined;
  }

  function randBytes(n) {
    var b = new Uint8Array(n);
    (window.crypto || window.msCrypto).getRandomValues(b);
    return b;
  }
  function b64(bytes, urlSafe) {
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    var out = btoa(s);
    return urlSafe ? out.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') : out;
  }
  function hex(bytes) {
    return Array.prototype.map.call(bytes, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }

  // Only kinds that are pure randomness can be done client-side. Anything
  // involving curve maths (reality, wireguard, ssh) must come from the server.
  function localKeygen(spec) {
    switch (spec.kind) {
      case 'uuid':
        if (window.crypto && crypto.randomUUID) return { uuid: crypto.randomUUID() };
        var r = randBytes(16); r[6] = (r[6] & 0x0f) | 0x40; r[8] = (r[8] & 0x3f) | 0x80;
        var s = hex(r);
        return { uuid: s.slice(0, 8) + '-' + s.slice(8, 12) + '-' + s.slice(12, 16) + '-' + s.slice(16, 20) + '-' + s.slice(20) };
      case 'password': return { password: b64(randBytes(16), true) };
      case 'shortid':  return { short_id: hex(randBytes(4)) };
      case 'ss2022':   return { password: b64(randBytes(spec.method === '2022-blake3-aes-128-gcm' ? 16 : 32), false) };
      default: return null;
    }
  }

  function runGen(spec, targetPath, quiet) {
    var body = { kind: spec.kind };
    if (spec.method) body.method = spec.method;

    return fetch('/api/keygen', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (data) {
      applyGen(spec, targetPath, data);
      if (!quiet) toast(t('genOk') + ' · ' + spec.kind);
    }).catch(function () {
      var local = localKeygen(spec);
      if (!local) { if (!quiet) toast(t('genFail'), 'err'); return; }
      applyGen(spec, targetPath, local);
      if (!quiet) toast(t('genLocal'), 'warn');
    });
  }

  function applyGen(spec, targetPath, data) {
    if (spec.map) {
      Object.keys(spec.map).forEach(function (key) {
        var v = pick(data, [key]);
        if (v !== undefined) setPath(state.node, spec.map[key], v);
      });
      // Short IDs live in a list on the server and as one selected value in links.
      if (spec.also) {
        var one = getPath(state.node, spec.map[Object.keys(spec.map)[0]]);
        if (one) setPath(state.node, spec.also, [one]);
      }
    } else if (targetPath) {
      var val = pick(data, [
        'uuid', 'password', 'psk', 'key', 'short_id', 'private_key', 'private_key_pem', 'value', 'id'
      ]);
      if (val !== undefined) setPath(state.node, targetPath, val);
    }
    renderForm();
    schedulePreview(0);
  }

  /* =========================================================================
   * 10. Live preview — POST /api/studio/preview on every keystroke
   * ====================================================================== */

  var previewTimer = null;
  var inflight = null;

  function payload() {
    var n = clone(state.node);
    n.port = Number(n.port) || 0;
    var out = prune(n) || {};
    out.protocol = n.protocol;                    // never pruned away
    out.address = n.address || '';
    out.port = n.port;
    return out;
  }

  function schedulePreview(delay) {
    if (previewTimer) clearTimeout(previewTimer);
    previewTimer = setTimeout(runPreview, delay === undefined ? 250 : delay);
    setLive('busy', t('validating'));
  }

  function runPreview() {
    var seq = ++state.reqSeq;
    var started = (window.performance && performance.now) ? performance.now() : Date.now();
    if (inflight && inflight.abort) { try { inflight.abort(); } catch (e) { /* older browsers */ } }
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    inflight = ctrl;

    fetch('/api/studio/preview', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload()),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) {
      return r.json().then(function (j) { return { status: r.status, body: j }; })
        .catch(function () { return { status: r.status, body: null }; });
    }).then(function (res) {
      if (seq !== state.reqSeq) return;             // a newer keystroke won
      var now = (window.performance && performance.now) ? performance.now() : Date.now();
      var ms = Math.max(0, Math.round(now - started));
      if (!res.body) {
        applyPreview({ ok: false, errors: [{ severity: 'error', message: t('previewFailed') + ' (HTTP ' + res.status + ')' }] }, ms);
        return;
      }
      applyPreview(res.body, ms);
    }).catch(function (err) {
      if (err && err.name === 'AbortError') return;
      if (seq !== state.reqSeq) return;
      applyPreview({ ok: false, errors: [{ severity: 'error', message: t('offline') + ' — ' + (err && err.message ? err.message : 'network error') }] }, -1);
    });
  }

  function applyPreview(data, ms) {
    state.preview = {
      ok: !!data.ok,
      uri: data.uri || '',
      xray: data.xray || '',
      singbox: data.singbox || '',
      clash: data.clash || '',
      errors: Array.isArray(data.errors) ? data.errors : []
    };
    renderPreview();
    var hardError = state.preview.errors.some(function (e) { return (e.severity || 'error') === 'error'; });
    if (ms < 0) setLive('err', t('offline'));
    else setLive(hardError ? 'err' : 'ok', (hardError ? '' : t('ready') + ' · ') + ms + ' ms');
  }

  function setLive(kind, text) {
    var b = $('#liveBadge');
    b.className = 'live' + (kind === 'busy' ? ' busy' : kind === 'err' ? ' err' : '');
    $('#liveText').textContent = text;
  }

  /* Lightweight token colouring — enough to read a config at a glance. */
  function hlJSON(s) {
    return esc(s).replace(
      /("(?:\\.|[^"\\])*"(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,
      function (m) {
        var cls = 'n';
        if (m.charAt(0) === '"') cls = /:\s*$/.test(m) ? 'k' : 's';
        else if (/^(true|false|null)$/.test(m)) cls = 'b';
        return '<span class="' + cls + '">' + m + '</span>';
      }
    );
  }
  function hlYAML(s) {
    return esc(s)
      .replace(/^(\s*(?:- )?)([\w.\-]+)(:)/gm, '$1<span class="k">$2</span>$3')
      .replace(/(:\s+)(&#39;[^&]*&#39;|&quot;[^&]*&quot;|[^\n<]+)$/gm, function (m, p1, p2) {
        if (/^(true|false|\d+)$/.test(p2.trim())) return p1 + '<span class="b">' + p2 + '</span>';
        return p1 + '<span class="s">' + p2 + '</span>';
      })
      .replace(/^(\s*)(#.*)$/gm, '$1<span class="p">$2</span>');
  }

  // When there is no URI, say why: a real validation error beats a generic hint,
  // and a successful build with an empty URI means the protocol simply has no
  // standalone link (ShadowTLS, for one — it is exported via the node it wraps).
  function emptyReason() {
    var p = state.preview;
    for (var i = 0; i < p.errors.length; i++) {
      if ((p.errors[i].severity || 'error').toLowerCase() === 'error' && p.errors[i].message) return p.errors[i].message;
    }
    if (p.ok || p.errors.length) return t('noUri');
    return t('waiting');
  }

  // Engine panes are empty for a different reason than the URI pane: the build
  // succeeded, that engine just does not carry this protocol (spec §3 routing:
  // Xray = V2Ray family + WireGuard, sing-box = QUIC family, Brook = external).
  function paneEmpty(key) {
    return state.preview.ok ? t(key) : emptyReason();
  }

  function renderPreview() {
    var p = state.preview;

    $('#outUri').innerHTML = p.uri
      ? '<span class="s">' + esc(p.uri) + '</span>'
      : '<em>' + esc(emptyReason()) + '</em>';

    $('#outXray').innerHTML = p.xray ? hlJSON(p.xray) : '<em>' + esc(paneEmpty('noXray')) + '</em>';
    $('#outSingbox').innerHTML = p.singbox ? hlJSON(p.singbox) : '<em>' + esc(paneEmpty('noSingbox')) + '</em>';
    $('#outClash').innerHTML = p.clash ? hlYAML(p.clash) : '<em>' + esc(paneEmpty('noClash')) + '</em>';

    drawQR(p.uri);
    renderFindings();
  }

  function renderFindings() {
    var box = $('#findings');
    box.innerHTML = '';
    var errs = state.preview.errors;
    if (!errs.length) {
      box.appendChild(h('div', { class: 'findings-empty' }, [
        h('span', { style: 'width:7px;height:7px;border-radius:99px;background:var(--ok);display:inline-block' }),
        h('span', { text: t('noIssues') })
      ]));
      return;
    }
    errs.forEach(function (e) {
      var sev = (e.severity || 'error').toLowerCase();
      if (['error', 'warn', 'warning', 'info'].indexOf(sev) === -1) sev = 'info';
      if (sev === 'warning') sev = 'warn';
      box.appendChild(h('div', { class: 'finding ' + sev }, [
        h('span', { class: 'sev' }),
        h('span', { class: 'msg', text: e.message || String(e) })
      ]));
    });
  }

  /* ---- QR ---------------------------------------------------------------- */

  function drawQR(text) {
    var canvas = $('#qrCanvas'), ctx = canvas.getContext('2d'), meta = $('#qrMeta');
    var cssSize = Math.min(canvas.clientWidth || 236, 320) || 236;
    var dpr = window.devicePixelRatio || 1;

    var qr = text ? QR.encode(text) : null;
    if (!qr) {
      canvas.width = canvas.height = Math.round(cssSize * dpr);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#9aa3b5';
      ctx.font = (13 * dpr) + 'px ' + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('—', canvas.width / 2, canvas.height / 2);
      meta.textContent = text ? t('qrTooLong') : emptyReason();
      return;
    }

    var quiet = 4, n = qr.size + quiet * 2;
    var scale = Math.max(1, Math.ceil(cssSize * dpr / n));
    canvas.width = canvas.height = n * scale;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000000';
    for (var y = 0; y < qr.size; y++) {
      for (var x = 0; x < qr.size; x++) {
        if (qr.modules[y][x]) ctx.fillRect((x + quiet) * scale, (y + quiet) * scale, scale, scale);
      }
    }
    meta.innerHTML = esc(t('qrHint')) + '<br><code>' + esc('v' + qr.version + ' · ecc ' + qr.ecl + ' · mask ' + qr.mask + ' · ' + text.length + ' chars') + '</code>';
  }

  /* =========================================================================
   * 11. Tabs, copy, download
   * ====================================================================== */

  var TABS = ['uri', 'qr', 'xray', 'singbox', 'clash'];

  function selectTab(name) {
    if (TABS.indexOf(name) === -1) name = 'uri';
    state.tab = name;
    $$('.tab').forEach(function (b) {
      var on = b.getAttribute('data-tab') === name;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
    });
    TABS.forEach(function (tn) {
      $('#panel-' + tn).setAttribute('data-active', tn === name ? 'true' : 'false');
    });
    if (name === 'qr') drawQR(state.preview.uri);
    save('tab', name);
  }

  function currentPayload() {
    var p = state.preview;
    switch (state.tab) {
      case 'xray': return { text: p.xray, name: 'xray-inbound.json', mime: 'application/json' };
      case 'singbox': return { text: p.singbox, name: 'sing-box.json', mime: 'application/json' };
      case 'clash': return { text: p.clash, name: 'clash.yaml', mime: 'text/yaml' };
      default: return { text: p.uri, name: (state.node.protocol || 'node') + '.txt', mime: 'text/plain' };
    }
  }

  function copyText(text) {
    if (!text) { toast(t('copyFailed'), 'warn'); return; }
    var done = function () { toast(t('copied')); };
    var fail = function () {
      // Clipboard API is unavailable over plain HTTP; fall back to a temp node.
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        ok ? done() : toast(t('copyFailed'), 'err');
      } catch (e) { toast(t('copyFailed'), 'err'); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail);
    else fail();
  }

  function download(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = h('a', { href: url, download: name });
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  /* =========================================================================
   * 12. Theme, language, layout preferences
   * ====================================================================== */

  function save(k, v) { try { localStorage.setItem('forgepanel.studio.' + k, v); } catch (e) { /* private mode */ } }
  function load(k, dflt) { try { var v = localStorage.getItem('forgepanel.studio.' + k); return v === null ? dflt : v; } catch (e) { return dflt; } }

  function setTheme(theme) {
    state.theme = theme === 'light' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', state.theme);
    $('#themeIcon').textContent = state.theme === 'dark' ? '◐' : '☀';
    $('#themeLabel').textContent = t(state.theme);
    save('theme', state.theme);
    if (state.tab === 'qr') drawQR(state.preview.uri);
  }

  function setLang(lang) {
    state.lang = lang === 'fa' ? 'fa' : 'en';
    var rtl = state.lang === 'fa';
    document.documentElement.lang = state.lang;
    document.documentElement.dir = rtl ? 'rtl' : 'ltr';
    $('#langEn').setAttribute('aria-pressed', rtl ? 'false' : 'true');
    $('#langFa').setAttribute('aria-pressed', rtl ? 'true' : 'false');
    $$('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    $('#protoSearch').setAttribute('placeholder', t('searchPh'));
    $('#protoSearch').setAttribute('aria-label', t('search'));
    $('#themeLabel').textContent = t(state.theme);
    save('lang', state.lang);
    renderAll();
    renderPreview();
  }

  function setMobilePane(pane) {
    state.mobilePane = pane === 'preview' ? 'preview' : 'build';
    var narrow = isNarrow();
    var preview = state.mobilePane === 'preview';
    $('#paneRail').hidden = narrow && preview;
    $('#paneForm').hidden = narrow && preview;
    $('#panePreview').hidden = narrow && !preview;
    $$('#mobileNav button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-pane') === state.mobilePane ? 'true' : 'false');
    });
    if (preview) drawQR(state.preview.uri);
  }

  function renderAll() {
    renderProtocols();
    renderChips();
    renderPresets();
    renderForm();
  }

  /* =========================================================================
   * 13. Toasts
   * ====================================================================== */

  function toast(msg, kind) {
    var box = $('#toasts');
    var el = h('div', { class: 'toast' + (kind ? ' ' + kind : ''), role: 'status' }, [
      h('span', { class: 'tdot' }), h('span', { text: msg })
    ]);
    box.appendChild(el);
    setTimeout(function () {
      el.classList.add('out');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 220);
    }, 2600);
  }

  /* =========================================================================
   * 14. Events
   * ====================================================================== */

  function focusSearch() {
    var s = $('#protoSearch');
    if (isNarrow()) setMobilePane('build');
    s.focus(); s.select();
  }

  function wireEvents() {
    // --- search / command palette ---
    var search = $('#protoSearch');
    search.addEventListener('input', function () { state.filter = search.value; renderProtocols(); });
    search.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { search.value = ''; state.filter = ''; renderProtocols(); search.blur(); }
      else if (e.key === 'Enter') {
        var first = $('.proto', $('#protoList'));
        if (first) { first.click(); search.blur(); }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        var f = $('.proto', $('#protoList'));
        if (f) f.focus();
      }
    });
    $('#paletteHint').addEventListener('click', focusSearch);

    // --- protocol list roving focus ---
    $('#protoList').addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var items = $$('.proto', $('#protoList'));
      var i = items.indexOf(document.activeElement);
      var next = e.key === 'ArrowDown' ? i + 1 : i - 1;
      if (next < 0) { $('#protoSearch').focus(); return; }
      if (next >= items.length) next = items.length - 1;
      if (items[next]) items[next].focus();
    });

    // --- tabs ---
    $('#tabBar').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('.tab') : null;
      if (b) selectTab(b.getAttribute('data-tab'));
    });
    $('#tabBar').addEventListener('keydown', function (e) {
      var keys = ['ArrowRight', 'ArrowLeft', 'Home', 'End'];
      if (keys.indexOf(e.key) === -1) return;
      e.preventDefault();
      var rtl = document.documentElement.dir === 'rtl';
      var i = TABS.indexOf(state.tab), n = TABS.length;
      if (e.key === 'Home') i = 0;
      else if (e.key === 'End') i = n - 1;
      else {
        var fwd = (e.key === 'ArrowRight') !== rtl;
        i = (i + (fwd ? 1 : -1) + n) % n;
      }
      selectTab(TABS[i]);
      $('#tab-' + TABS[i]).focus();
    });

    // --- preview actions ---
    $('#copyBtn').addEventListener('click', function () {
      if (state.tab === 'qr') copyText(state.preview.uri);
      else copyText(currentPayload().text);
    });
    $('#downloadBtn').addEventListener('click', function () {
      if (state.tab === 'qr') {
        var canvas = $('#qrCanvas');
        canvas.toBlob(function (blob) {
          if (blob) download(blob, 'forgepanel-' + state.node.protocol + '-qr.png');
        });
        return;
      }
      var cur = currentPayload();
      if (!cur.text) { toast(t('copyFailed'), 'warn'); return; }
      download(new Blob([cur.text], { type: cur.mime + ';charset=utf-8' }), 'forgepanel-' + cur.name);
    });
    $('#jsonBtn').addEventListener('click', function () { copyText(JSON.stringify(payload(), null, 2)); });
    $('#resetBtn').addEventListener('click', function () {
      state.node = defaultNode(state.node.protocol);
      renderAll(); schedulePreview(0); toast(t('resetDone'));
    });

    // --- theme / language ---
    $('#themeBtn').addEventListener('click', function () { setTheme(state.theme === 'dark' ? 'light' : 'dark'); });
    $('#langEn').addEventListener('click', function () { setLang('en'); });
    $('#langFa').addEventListener('click', function () { setLang('fa'); });

    // --- mobile pane switcher ---
    $('#mobileNav').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null;
      if (b) setMobilePane(b.getAttribute('data-pane'));
    });
    window.addEventListener('resize', function () { setMobilePane(state.mobilePane); });

    // --- global keyboard ---
    document.addEventListener('keydown', function (e) {
      var mod = e.metaKey || e.ctrlKey;
      if (mod && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); focusSearch(); return; }
      if (mod && e.shiftKey && (e.key === 'c' || e.key === 'C')) {
        e.preventDefault();
        copyText(state.tab === 'qr' ? state.preview.uri : currentPayload().text);
        return;
      }
      if (e.key === 'Escape' && document.activeElement === $('#protoSearch')) return;   // handled above
    });
  }

  /* =========================================================================
   * 15. Boot
   * ====================================================================== */

  function loadProtocols() {
    return fetch('/api/protocols', { headers: { 'Accept': 'application/json' } })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (list) {
        if (!Array.isArray(list) || !list.length) return;
        var merged = [];
        list.forEach(function (srv) {
          var proto = srv.proto || srv.protocol;
          if (!proto) return;
          var local = null;
          for (var i = 0; i < CATALOG.length; i++) if (CATALOG[i].proto === proto) local = CATALOG[i];
          merged.push({
            proto: proto,
            label: srv.label || (local ? local.label : proto),
            glyph: local ? local.glyph : proto.slice(0, 2).toUpperCase(),
            hint: (local && local.hint) || '',
            transports: Array.isArray(srv.transports) ? srv.transports : (local ? local.transports : []),
            securities: Array.isArray(srv.securities) && srv.securities.length ? srv.securities : (local ? local.securities : ['none'])
          });
        });
        if (merged.length) CATALOG = merged;
      })
      .catch(function () { /* offline: the built-in catalogue is already correct */ });
  }

  function init() {
    state.lang = load('lang', 'en');
    state.theme = load('theme', 'dark');
    state.tab = load('tab', 'uri');
    state.node = defaultNode('vless');

    // ⌘ on Apple hardware, Ctrl everywhere else.
    var keyLabel = isMac() ? '⌘K' : 'Ctrl K';
    $('#kbdKey').textContent = keyLabel;
    $('#kbdKey2').textContent = keyLabel;

    setTheme(state.theme);
    setLang(state.lang);              // renders everything once
    selectTab(state.tab);
    setMobilePane('build');
    wireEvents();
    setLive('', t('idle'));

    loadProtocols().then(function () {
      // The server may disagree with the built-in catalogue; re-sync the node.
      var cat = catalogFor(state.node.protocol);
      if (cat.transports.length && cat.transports.indexOf(state.node.transport.network) === -1) {
        state.node.transport = { network: cat.transports[0] };
      }
      if (cat.securities.indexOf(state.node.security.type) === -1) {
        state.node.security = { type: cat.securities[0] || 'none' };
      }
      renderAll();
      runGen({ kind: 'uuid' }, 'uuid', true);   // start with a usable credential
      schedulePreview(0);
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
