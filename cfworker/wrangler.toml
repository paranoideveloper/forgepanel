# ForgeEdge — Cloudflare Worker deploy config.
#
#   npm i -g wrangler          # once
#   wrangler login             # or set CLOUDFLARE_API_TOKEN
#   wrangler deploy            # ships _worker.js to <name>.<subdomain>.workers.dev
#
# Or skip wrangler entirely: create a Worker in the Cloudflare dashboard and
# paste the contents of _worker.js.
name = "forgeedge"
main = "_worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Set your VLESS id here (or in the dashboard under Variables). If omitted, the
# Worker derives a stable UUID from its hostname — works immediately, but set
# your own for a private id.
[vars]
# UUID = "paste-a-uuid-here"
# PROXYIP = ""            # optional relay host[:port] for blocked/Cloudflare dests
# SUBPATH = ""           # secret path prefix for the panel (defaults to the UUID)
# DNS_RESOLVER = "1.1.1.1"
